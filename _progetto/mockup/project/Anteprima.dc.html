<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F2EBDC; color: #26211B; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px; line-height: 1.4">

      <span style="font-size: 13px; color: #5A5045">folio-import.zip - 18,40 MB</span>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">

        <span style="font-size: 12px; color: #5A5045">Quaderno</span>

        <span style="font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums">86</span>
        <span style="font-size: 12px; color: #5A5045">immagini</span>
      </div>
    </div>

    <div style="border: 1px solid #DDD0B6; border-radius: 12px; padding: 6px 12px; display: flex; flex-direction: column; font-size: 14px">

        <span style="font-size: 12px; color: #5A5045">nuovo</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; min-height: 32px; padding-left: 22px">
        <span style="flex-grow: 1">Ricette</span>
        <span style="font-size: 12.5px; color: #5A5045; font-variant-numeric: tabular-nums">74 Fogli</span>

      <div style="display: flex; align-items: center; gap: 8px; min-height: 32px; padding-left: 22px">
        <span style="flex-grow: 1">Viaggi</span>

      </div>
      <div style="display: flex; align-items: center; gap: 8px; min-height: 32px; padding-left: 22px">
        <span style="flex-grow: 1">Casa</span>
        <span style="font-size: 12.5px; color: #5A5045; font-variant-numeric: tabular-nums">48 Fogli</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; min-height: 32px; padding-left: 22px">
        <span style="flex-grow: 1">Lavoro</span>
        <span style="font-size: 12.5px; color: #5A5045; font-variant-numeric: tabular-nums">39 Fogli, esiste già: si unisce</span>
      </div>

    <div style="display: flex; flex-direction: column; gap: 8px">

        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 13.5px">1 Foglio molto lungo (2,10 MB): <strong>Manuale caldaia</strong>.</span>
          <div style="display: flex; gap: 6px">
            <button style="height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid #B8863F; background: #FBF8F1; font-size: 13px; font-weight: 600; color: #82531A">Dividi ai titoli</button>
            <button style="height: 32px; padding: 0 10px; border-radius: 8px; font-size: 13px; color: #5A5045">Importa così</button>
          </div>
        </div>

      <div style="display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 13.5px; color: #26211B">
        <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; color: #5A5045; flex: none"><rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2"></rect><path d="M15.5 8.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h2.5"></path></svg>
        <span>3 doppioni saltati</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 13.5px; color: #26211B">
        <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; color: #5A5045; flex: none"><path d="M15.5 7.5 8 15a2.1 2.1 0 0 0 3 3l7.5-7.5a4.2 4.2 0 0 0-6-6L5 12a6.4 6.4 0 0 0 9 9l5-5"></path></svg>
        <span>5 allegati non importati (pdf) - <span style="color: #82531A; text-decoration: underline; text-underline-offset: 2px">vedi elenco</span></span>

    </div>

    <span style="flex-grow: 1"></span>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button style="height: 48px; border-radius: 10px; border: 1px solid #CEBFA2; font-weight: 600; font-size: 15px">Annulla</button>
      <button style="height: 48px; border-radius: 10px; background: #82531A; color: #FFF9EE; font-weight: 600; font-size: 15px">Importa 209 Fogli</button>
    </div>
  </div>

  <div role="status" style="position: absolute; left: 16px; right: 16px; top: 10px; height: 0; overflow: visible"></div>
</div>
