function unisci(dati){
  const mappaQ = {}, mappaS = {};
  dati.quaderni.forEach(q => {
    const esiste = A.quaderni.find(x => x.nome === q.nome);
    if (esiste) mappaQ[q.id] = esiste.id;
    else { const n = { id:id(), nome:q.nome, creato:oggi() }; A.quaderni.push(n); mappaQ[q.id] = n.id; }
  });
  dati.sezioni.forEach(s => {
    const qid = mappaQ[s.quadernoId] || A.quaderni[0].id;
    const esiste = A.sezioni.find(x => x.quadernoId === qid && x.nome === s.nome);
    if (esiste) mappaS[s.id] = esiste.id;
    else { const n = { id:id(), quadernoId:qid, nome:s.nome, creata:oggi() }; if (s.icona) n.icona = s.icona; A.sezioni.push(n); mappaS[s.id] = n.id; }
  });
  let n = 0, saltati = 0;
  /* i Fogli protetti entrano solo se usano la stessa password di questo archivio */
  const stessaPassword = !!(A.cassaforte && dati.cassaforte && A.cassaforte.sale === dati.cassaforte.sale);
  dati.fogli.forEach(p => {
    if (p.protetto && !stessaPassword){ saltati++; return; }
    const nuovo = { id:id(), sezioneId: mappaS[p.sezioneId] || A.sezioni[0].id,
      titolo: titoloLibero(p.titolo), md:p.md, creata:p.creata, modificata:p.modificata };
    if (p.protetto){ nuovo.protetto = true; nuovo.cifra = p.cifra; }
    if (p.allinea) nuovo.allinea = Object.assign({}, p.allinea);
    A.fogli.push(nuovo);
    /* le misure delle immagini che il Foglio usa arrivano con lui (i dati sono già stati scritti) */
    idsImmagini(p.md).forEach(k => { if (dati.immagini[k]) A.immagini[k] = dati.immagini[k]; });
    n++;
  });
  const fine = () => {
    salva(); disegnaLato();
    avviso(tn(n, 'Foglio aggiunto.', 'Fogli aggiunti.')
      + (saltati ? ' ' + T('{n}: hanno un\'altra password, usa "Sostituisci tutto".', { n:tn(saltati, 'Foglio protetto saltato', 'Fogli protetti saltati') }) : ''), null, null, saltati ? 9000 : 0);
  };
  if (chiave) apriCifre(chiave).then(fine); else fine();
}
/* ============ immagini ============ */
/* Due tipi di immagine:
   - incorporate (fotocamera, galleria): ridotte a 1600 px, salvate a parte nel database ("i:" + id)
     e scritte nel Foglio come percorso, immagini/<id>.jpg. Nella struttura restano solo misure e peso
     (A.immagini), che servono ai segnaposto quando un Foglio esce da solo, senza le sue immagini;
   - collegate: nel Foglio c'è il loro indirizzo web, si vedono solo con la rete.
   A schermo un'immagine incorporata usa un indirizzo provvisorio (blob), mai salvato. */
const RE_PERCORSO = /immagini\/([a-z0-9]+\.(?:jpe?g|png|gif|webp))/gi;
const LATO_MASSIMO = 1600;
const urlImmagini = new Map();           /* nome file -> indirizzo provvisorio */
const inArrivo = new Map();

function idsImmagini(md){
  const v = new Set();
  String(md || '').replace(RE_PERCORSO, (m, nome) => { v.add(nome.split('.')[0]); return m; });
  return v;
}
const estensione = tipo => ({ 'image/png':'png', 'image/gif':'gif', 'image/webp':'webp' })[tipo] || 'jpg';

function caricaImmagine(nome){
  if (urlImmagini.has(nome)) return Promise.resolve(urlImmagini.get(nome));
  if (!inArrivo.has(nome)) inArrivo.set(nome, leggiIdb('i:' + nome.split('.')[0]).then(r => {
    inArrivo.delete(nome);
    if (!r || typeof r.b64 !== 'string') return null;
    const u = URL.createObjectURL(new Blob([daB64(r.b64)], { type: r.tipo || 'image/jpeg' }));
    urlImmagini.set(nome, u);
    return u;
  }));
  return inArrivo.get(nome);
}
/* i dati di più immagini, per backup ed esportazioni */
async function datiImmagini(ids){
  const fuori = {};
  for (const k of ids){
    const r = await leggiIdbCerto('i:' + k);
    if (r && typeof r.b64 === 'string') fuori[k] = r;
  }
  return fuori;
}

/* le immagini del Foglio aperto arrivano dal database un attimo dopo il testo: il Foglio
   non risulta modificato per questo */
function riempiImmagini(){
  const vuote = [...corpo().querySelectorAll('img[data-img]:not([src])')];
  if (!vuote.length) return;
  Promise.all([...new Set(vuote.map(i => i.getAttribute('data-img')))].map(caricaImmagine)).then(() => {
    const intatto = htmlCorpo() === htmlAperto;
    corpo().querySelectorAll('img[data-img]:not([src])').forEach(i => {
      const u = urlImmagini.get(i.getAttribute('data-img'));
      if (u) i.setAttribute('src', u);
      else if (!i.classList.contains('mancante')){ i.classList.add('mancante'); i.title = T('Immagine non trovata'); }
    });
    if (intatto) htmlAperto = htmlCorpo();
  });
}

/* segnaposto con misure e peso, per un Foglio che esce da solo come file .md o come testo */
function segnapostoImmagini(md){
  const s = (m, nome) => {
    const x = A.immagini[nome.split('.')[0]];
    return x ? T('[Immagine: {w} × {h} px, {kb} kB]', { w:x.w, h:x.h, kb:numero(x.peso / 1024) }) : T('[Immagine]');
  };
  return String(md)
    .replace(/!\[[^\]]*\]\(immagini\/([a-z0-9]+\.[a-z0-9]+)\)/gi, s)
    .replace(/<img\b[^>]*\bsrc="immagini\/([a-z0-9]+\.[a-z0-9]+)"[^>]*>/gi, s);
}

/* ============ immagine scelta e sua barra ============ */
let immagineScelta = null, barraImmagineAperta = true;
const togliClasse = (n, c) => { n.classList.remove(c); if (!n.classList.length) n.removeAttribute('class'); };
/* il testo del Foglio senza il segno di selezione dell'immagine, che non va mai salvato */
function htmlCorpo(){
  const s = immagineScelta && corpo().contains(immagineScelta) ? immagineScelta : null;
  if (s) togliClasse(s, 'scelta');
  const h = corpo().innerHTML;
  if (s) s.classList.add('scelta');
  return h;
}
function bloccoDiImmagine(img){
  let n = img;
  while (n && n.parentNode && n.parentNode !== corpo()) n = n.parentNode;
  return n && n.parentNode === corpo() && /^(P|H1|H2|H3)$/.test(n.nodeName) ? n : null;
}
function selezionaImmagine(img, nuova){
  if (immagineScelta && immagineScelta !== img) togliClasse(immagineScelta, 'scelta');
  immagineScelta = img || null;
  if (img){ img.classList.add('scelta'); if (nuova) barraImmagineAperta = true; }
  aggiornaBarraImmagine();
}
function aggiornaBarraImmagine(){
  const barra = $('#barraImmagine'), img = immagineScelta;
  const ok = !!(img && corrente && !vistaGrezza && corpo().contains(img));
  if (!ok && img){ togliClasse(img, 'scelta'); immagineScelta = null; }
  /* ridotta, la barra dell'immagine lascia solo un'icona nella barra del testo, che la riapre */
  barra.classList.toggle('nascosto', !ok || !barraImmagineAperta);
  $('#bApriImm').classList.toggle('nascosto', !ok || barraImmagineAperta);
  $('#bAvvolgiImm').dataset.verso = ($('#strumenti').dataset.lato || 'destra') === 'destra' ? 'destra' : 'sinistra';
  if (!ok) return;
  const b = bloccoDiImmagine(img), al = b ? allineamentoDi(b) : 'left', w = img.getAttribute('width') || '';
  barra.querySelectorAll('[data-img-cmd]').forEach(x => {
    const c = x.dataset.imgCmd;
    x.classList.toggle('accesa', (c === 'sx' && al === 'left') || (c === 'centro' && al === 'center') || (c === 'dx' && al === 'right')
      || (c[0] === 'w' && w === c.slice(1) + '%') || (c === 'bordo' && img.classList.contains('bordo')));
  });
}
function comandoImmagine(c){
  const img = immagineScelta;
  if (!img || !corpo().contains(img)) return;
  segnaPasso('comando');
  if (c === 'sx' || c === 'centro' || c === 'dx'){
    const b = bloccoDiImmagine(img);
    if (!b){ avviso(T('Qui l\'immagine non si può allineare.')); return; }
    const al = { sx:'left', centro:'center', dx:'right' }[c];
    al === 'left' ? b.removeAttribute('align') : b.setAttribute('align', al);
  } else if (c[0] === 'w'){
    /* la misura scelta di nuovo torna automatica: dentro la colonna, mai più grande dell'originale */
    const v = c.slice(1) + '%';
    img.getAttribute('width') === v ? img.removeAttribute('width') : img.setAttribute('width', v);
  } else if (c === 'bordo'){
    img.classList.toggle('bordo');
  } else if (c === 'elimina'){
    const b = img.parentNode;
    togliClasse(img, 'scelta'); immagineScelta = null;
    img.remove();
    if (b && b.parentNode === corpo() && b.nodeName === 'P' && !b.textContent.trim() && !b.querySelector('img,input')){
      b.innerHTML = '<br>'; b.removeAttribute('align');
      const r = document.createRange(); r.setStart(b, 0); r.collapse(true);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    }
  }
  aggiornaBarraImmagine(); dopoModifica();
}

/* ============ inserimento ============ */
function dialogoImmagine(){
  if (!corrente || vistaGrezza) return;
  const protetto = !!corrente.protetto;
  dialogo(T('Inserisci un\'immagine'), (c, chiudi) => {
    const g = el('div','scelte');
    const voce = (titolo, nota, fai) => { const b = bottoneScelta(titolo, nota); b.onclick = () => { chiudi(); fai(); }; g.appendChild(b); };
    if (!protetto){
      voce(T('Scatta una foto'), T('Dalla fotocamera. Resta dentro al Foglio, anche senza rete.'), () => fileImmagine(true));
      voce(T('Scegli dalla galleria'), T('Dalle foto o dai file. Resta dentro al Foglio, anche senza rete.'), () => fileImmagine(false));
    }
    voce(T('Da un indirizzo web'), T('Collegata: il Foglio resta leggero, ma l\'immagine si vede solo con la rete.'), immagineDaLink);
    c.appendChild(g);
    if (protetto) c.appendChild(el('p','avvertenza', T('Nei Fogli protetti le immagini si possono solo collegare: quelle incorporate non verrebbero cifrate.')));
  });
}
function fileImmagine(fotocamera){
  const i = el('input'); i.type = 'file'; i.accept = 'image/*';
  if (fotocamera) i.setAttribute('capture', 'environment');
  i.onchange = () => { if (i.files && i.files[0]) incorporaImmagine(i.files[0]); };
  i.click();
}
function immagineDaLink(){
  chiediTesto(T('Immagine da un indirizzo web'), T('Indirizzo dell\'immagine (https://…)'), '', v => {
    const u = String(v).trim();
    if (!/^https:\/\/\S+$/i.test(u)){ avviso(T('Serve un indirizzo che inizia con https://')); return; }
    mettiImmagine(null, u);
  });
}

/* ridotta a 1600 px sul lato lungo, in JPEG; resta com'è se è già piccola e leggera */
async function preparaImmagine(file){
  const indirizzo = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = indirizzo; });
    let w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h) throw new Error('vuota');
    const lato = Math.max(w, h);
    let blob = file, tipo = file.type;
    if (!(/^image\/(png|gif|webp|jpeg)$/.test(file.type) && lato <= LATO_MASSIMO && file.size <= 900 * 1024)){
      const k = Math.min(1, LATO_MASSIMO / lato);
      w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
      const tela = document.createElement('canvas'); tela.width = w; tela.height = h;
      const g = tela.getContext('2d');
      g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
      g.drawImage(img, 0, 0, w, h);
      blob = await new Promise(r => tela.toBlob(r, 'image/jpeg', 0.85));
      tipo = 'image/jpeg';
      if (!blob) throw new Error('conversione');
    }
    return { blob, tipo, b64: inB64(await blob.arrayBuffer()), w, h, peso: blob.size };
  } finally { URL.revokeObjectURL(indirizzo); }
}
async function incorporaImmagine(file){
  const p = corrente;
  if (!p) return;
  if (!idb){ avviso(T('Questo browser non lascia salvare le immagini.')); return; }
  avviso(T('Preparo l\'immagine…'), null, null, 1500);
  let pronta;
  try { pronta = await preparaImmagine(file); }
  catch(e){ avviso(T('Non riesco a leggere questa immagine.')); return; }
  const idI = id(), nome = idI + '.' + estensione(pronta.tipo);
  try { await scriviIdb('i:' + idI, { tipo: pronta.tipo, b64: pronta.b64 }); }
  catch(e){ avviso(T('Non riesco a salvare l\'immagine: la memoria del browser potrebbe essere piena.'), null, null, 7000); return; }
  A.immagini[idI] = { tipo: pronta.tipo, w: pronta.w, h: pronta.h, peso: pronta.peso, creata: oggi() };
  urlImmagini.set(nome, URL.createObjectURL(pronta.blob));
  if (corrente !== p || vistaGrezza){ avviso(T('Immagine non inserita: il Foglio aperto è cambiato.')); return; }
  mettiImmagine(nome, null);
}
/* l'immagine entra in un paragrafo suo, dopo quello dove stava il cursore, e resta scelta
   con la sua barra aperta */
function mettiImmagine(nome, url){
  if (!corrente) return;
  ripristinaRange();
  segnaPasso('comando');
  const img = document.createElement('img');
  img.setAttribute('alt', '');
  if (nome){ img.setAttribute('data-img', nome); const u = urlImmagini.get(nome); if (u) img.setAttribute('src', u); }
  else img.setAttribute('src', url);
  const p = document.createElement('p');
  p.appendChild(img);
  const b = blocco();
  if (b && b.nodeName === 'P' && !b.textContent.trim() && !b.querySelector('img,input')) b.replaceWith(p);
  else if (b) b.after(p);
  else corpo().appendChild(p);
  if (!p.nextElementSibling){ const q = document.createElement('p'); q.appendChild(document.createElement('br')); p.after(q); }
  rangeSalvato = null;
  /* il testo lascia il fuoco: resta scelta l'immagine, e su telefono la tastiera si chiude */
  getSelection().removeAllRanges();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  selezionaImmagine(img, true);
  dopoModifica();
  img.scrollIntoView({ block:'nearest' });
}

/* dati delle immagini arrivati con un backup: si scrivono prima di aggiungere i Fogli */
async function salvaImmaginiImportate(imm){
  const metti = Object.entries(imm || {})
    .filter(([k, v]) => /^[a-z0-9]+$/.test(k) && v && typeof v.b64 === 'string')
    .map(([k, v]) => ['i:' + k, { tipo: /^image\/(jpeg|png|gif|webp)$/.test(v.tipo) ? v.tipo : 'image/jpeg', b64: v.b64 }]);
  if (!metti.length || !idb) return;
  try { await scriviMolti(metti, []); }
  catch(e){ avviso(T('Non riesco a salvare le immagini del backup.'), null, null, 7000); }
}

/* all'avvio si tolgono le immagini che nessun Foglio usa più (nemmeno nel Cestino) */
async function pulisciImmagini(){
  if (letturaFallita || !idb) return;
  const usate = new Set();
  tuttiIFogli().forEach(p => idsImmagini(p.md).forEach(k => usate.add(k)));
  Object.keys(A.immagini).forEach(k => { if (!usate.has(k)) delete A.immagini[k]; });
  let chiavi;
  try { chiavi = await leggiChiavi('i:'); } catch(e){ return; }
  const via = chiavi.filter(k => !usate.has(k.slice(2)));
  if (via.length) await scriviMolti([], via).catch(() => {});
}

function scegliIcona(s){
  const attuale = MAPPA_ICONE.has(s.icona) ? s.icona : 'cartella';
  dialogo(T('Icona del Gruppo'), (c, chiudi) => {

/* ============ ordine dei Gruppi ============ */
/* Riordino manuale: vale l'ordine in cui i Gruppi stanno nell'archivio, cambiato trascinandoli;
   l'ordine scelto nelle Impostazioni li mette in fila una volta. Automatico: l'elenco segue
   sempre l'ordine scelto (creazione, ultima modifica di un suo Foglio, nome). */
function ordinaPer(v, criterio){
  const pos = new Map(A.sezioni.map((s, k) => [s, k]));
  const ultime = {};
  if (criterio === 'modifica') A.fogli.forEach(p => { if (!ultime[p.sezioneId] || p.modificata > ultime[p.sezioneId]) ultime[p.sezioneId] = p.modificata; });
  const quando = s => ultime[s.id] || s.creata || '';
  return v.slice().sort((a, b) => {
    let d = 0;
    if (criterio === 'nome') d = senzaAccenti(a.nome).localeCompare(senzaAccenti(b.nome), undefined, { numeric:true });
    else if (criterio === 'modifica') d = quando(b) > quando(a) ? 1 : quando(b) < quando(a) ? -1 : 0;
    else d = (a.creata || '') < (b.creata || '') ? -1 : (a.creata || '') > (b.creata || '') ? 1 : 0;
    return d || pos.get(a) - pos.get(b);
  });
}
const ordinaGruppi = v => A.impostazioni.riordinoManuale ? v : ordinaPer(v, A.impostazioni.ordineGruppi);
function riordinaSecondo(criterio){ A.sezioni = ordinaPer(A.sezioni, criterio); }

function entraRiordino(){
  if (!A.impostazioni.riordinoManuale){ avviso(T('Il riordino a mano si accende nelle Impostazioni.')); return; }

function disegnaRiordino(albero, sezQ){
  albero.appendChild(el('p','riassunto-ricerca', T('Trascina la maniglia per spostare un Gruppo. Hai finito? Tocca la X in alto.')));

    const m = el('button','maniglia-gruppo');

    m.setAttribute('aria-label', m.title + ': ' + s.nome);
    cap.append(nome, m);

function trascinaGruppo(m, box, s){
  m.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { m.setPointerCapture(e.pointerId); } catch(x){}
    const albero = $('#albero');
    const scatole = [...albero.querySelectorAll('.sezione.in-riordino')];
    const linea = el('div','linea-posto');
    albero.appendChild(linea);
    box.classList.add('in-spostamento');
    let dove = null, ultimoY = e.clientY;
    const segna = y => {
      let k = scatole.findIndex(b => { const r = b.getBoundingClientRect(); return y < r.top + r.height / 2; });
      if (k < 0) k = scatole.length;
      dove = k;
      const ra = albero.getBoundingClientRect();
      const yl = k < scatole.length ? scatole[k].getBoundingClientRect().top - 2 : scatole[scatole.length - 1].getBoundingClientRect().bottom + 1;
      Object.assign(linea.style, { left:'10px', right:'10px', top:(yl - ra.top + albero.scrollTop - 1.5) + 'px', height:'3px' });
    };
    /* vicino ai bordi l'elenco scorre da solo */
    const scorri = setInterval(() => {
      const ra = albero.getBoundingClientRect();
      const v = ultimoY < ra.top + 36 ? -8 : ultimoY > ra.bottom - 36 ? 8 : 0;
      if (v){ albero.scrollTop += v; segna(ultimoY); }
    }, 30);
    const muovi = ev => { ultimoY = ev.clientY; segna(ev.clientY); };
    const fine = () => {
      clearInterval(scorri);
      m.removeEventListener('pointermove', muovi);
      m.removeEventListener('pointerup', fine);
      m.removeEventListener('pointercancel', fine);
      linea.remove();
      box.classList.remove('in-spostamento');
      if (dove == null) return;
      const davanti = scatole[dove] ? sezione(scatole[dove].dataset.id) : null;
      if (!spostaGruppo(s, davanti)) disegnaLato();
    };
    segna(e.clientY);
    m.addEventListener('pointermove', muovi);
    m.addEventListener('pointerup', fine);
    m.addEventListener('pointercancel', fine);
  });
}
/* sposta il Gruppo davanti a un altro dello stesso Quaderno, oppure in fondo (davanti = null) */
function spostaGruppo(s, davanti){
  const v = A.sezioni, i = v.indexOf(s);
  if (i < 0 || davanti === s) return false;
  const stessi = v.filter(x => x.quadernoId === s.quadernoId);
  const k = stessi.indexOf(s);
  if (davanti ? stessi[k + 1] === davanti : k === stessi.length - 1) return false;
  v.splice(i, 1);
  if (davanti) v.splice(v.indexOf(davanti), 0, s);
  else { const ultimo = stessi[stessi.length - 1]; v.splice(v.indexOf(ultimo) + 1, 0, s); }
  salva(); disegnaLato();
  return true;
}

/* ============ eventi ============ */
/* un gesto di scorrimento col dito: chiama fai(dx, dy) se è stato breve e deciso */
function gesto(zona, fai){
  let x0 = 0, y0 = 0, t0 = 0, attivo = false, partenza = null;
  zona.addEventListener('touchstart', e => {
    if (e.touches.length !== 1){ attivo = false; return; }
    attivo = true; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now(); partenza = e.target;
  }, { passive:true });
  zona.addEventListener('touchend', e => {
    if (!attivo) return;
    attivo = false;
    const t = e.changedTouches[0];
    if (Date.now() - t0 > 700) return;
    fai(t.clientX - x0, t.clientY - y0, { target: partenza, x0 });
  }, { passive:true });
}
function cambiaVolume(verso){
  const n = A.quaderni.length;
  if (n < 2){ avviso(T('C\'è un solo Quaderno.')); return; }
  const i = A.quaderni.findIndex(q => q.id === A.impostazioni.quaderno);
  const q = A.quaderni[(i + verso + n) % n];
  A.impostazioni.quaderno = q.id;
  mostraVuoto(); salva(); disegnaLato(); vista('elenco');
  const a = $('#albero');
  a.classList.remove('da-destra','da-sinistra'); void a.offsetWidth;
  a.classList.add(verso > 0 ? 'da-destra' : 'da-sinistra');
}

  c.addEventListener('touchend', e => {

  let chiusiUscendo = false, ultimoGesto = Date.now();

    if (document.hidden){

  setInterval(() => {
    if (chiave && Date.now() - ultimoGesto > INATTIVITA) blocca(true).then(() => avviso(T('Fogli protetti richiusi dopo 10 minuti senza attività.')));
  }, 30000);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applicaAspetto);

  /* l'app occupa sempre e solo la parte visibile dello schermo: con la tastiera aperta
     si accorcia, così la barra in alto resta in alto e quella in basso sta sopra i tasti */
  if (window.visualViewport){
    const vv = window.visualViewport;
    const adatta = () => {
      if (vv.scale > 1.01) return;          /* durante lo zoom con due dita non si tocca niente */
      const s = document.documentElement.style;
      s.setProperty('--alto', Math.round(vv.height) + 'px');
      s.setProperty('--su', Math.round(vv.offsetTop) + 'px');
      if (window.scrollY) window.scrollTo(0, 0);
    };
    vv.addEventListener('resize', adatta);
    vv.addEventListener('scroll', adatta);
    adatta();
  }
  addEventListener('resize', () => posizionaLibera());
}

/* ============ avvio ============ */
/* folio aperta in due finestre (app installata e scheda del browser) scriverebbe a turno
   sullo stesso archivio: l'ultima aperta prende il posto, le altre salvano e si mettono in pausa */
let inPausa = false;
const canale = ('BroadcastChannel' in window) ? new BroadcastChannel('folio') : null;
function aspettaAltreFinestre(){
  if (!canale) return Promise.resolve();
  return new Promise(res => {
    let altre = false, fatto = false;
    const fine = () => { if (!fatto){ fatto = true; canale.removeEventListener('message', ascolta); res(); } };
    const ascolta = e => {
      if (e.data === 'ci-sono' && !altre){ altre = true; canale.postMessage('prendo'); setTimeout(fine, 2500); }
      if (e.data === 'salvato') fine();
    };
    canale.addEventListener('message', ascolta);
    canale.postMessage('chi-c-e');
    setTimeout(() => { if (!altre) fine(); }, 200);
  });
}
function ascoltaAltreFinestre(){
  if (!canale) return;
  canale.addEventListener('message', async e => {
    if (inPausa) return;
    if (e.data === 'chi-c-e') canale.postMessage('ci-sono');
    if (e.data === 'prendo'){
      chiudiGrezzo(); scriviCorrente(); finalizzaTitolo();
      await salvaOra();
      inPausa = true;
      canale.postMessage('salvato');
      mettiInPausa();
    }
  });
}
function mettiInPausa(){
  dialogo(T('folio è aperta altrove'), (c, chiudi, pie) => {
    c.appendChild(el('p', null, T('L\'hai aperta in un\'altra finestra o nell\'app installata. Per non mescolare le modifiche, qui folio è in pausa.')));
    const b = el('button','bott pieno',T('Usa questa finestra'));
    b.onclick = () => location.reload();
    pie.appendChild(b);
  }, null, null, { pieLibero:true, uscita: () => {} });
}

async function avvia(){
  await aspettaAltreFinestre();
  const esito = await carica();
  A = esito.a;
  applicaLingua();
  const scaduti = scadenzeCestino();
  await pulisciImmagini();
  applicaAspetto();
  collegaEventi();
  ascoltaAltreFinestre();
  impostaModo('normale');
  disegnaLato();
  await salvaOra();

  const grande = matchMedia('(min-width:900px)').matches;
  const ultimo = A.impostazioni.foglio && foglio(A.impostazioni.foglio);
  if (ultimo && grande && !ultimo.protetto) apri(ultimo.id);
  else {
    mostraVuoto();
    vista(grande ? 'foglio' : 'elenco');
    if (grande){
      const primo = sezioniDi(A.impostazioni.quaderno).flatMap(s => fogliDi(s.id)).find(p => !p.protetto);
      if (primo) apri(primo.id);
    }
  }

  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if (esito.nota) setTimeout(() => avviso(esito.nota), 800);
  if (letturaFallita) dialogo(T('Archivio non leggibile'), (c, chiudi, pie) => {
    c.appendChild(el('p', null, T('Il browser non mi lascia leggere i tuoi Fogli in questo momento. Non ho toccato niente e qui non salvo nulla: chiudi folio e riaprila.')));
    const b = el('button','bott pieno',T('Riprova')); b.onclick = () => location.reload(); pie.appendChild(b);
  }, null, null, { pieLibero:true, uscita: () => {} });
  if (scaduti) setTimeout(() => avviso(tn(scaduti, 'elemento scaduto dal cestino.', 'elementi scaduti dal cestino.')), 1400);

  const i = A.impostazioni;
  const giorni = i.ultimoBackup ? (Date.now() - new Date(i.ultimoBackup)) / GIORNO : 99;
  if (i.modificheDaSalvare && A.fogli.length > 2 && giorni > 7){
    setTimeout(() => avviso(T('Ci sono modifiche non ancora salvate in un backup.'), T('Esporta'), esportaJson, 9000), 2500);
  }

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
    /* una versione nuova pubblicata arriva da sola: quando è pronta lo si dice */
    const cera = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nuovo = reg.installing;
        if (!nuovo) return;
        nuovo.addEventListener('statechange', () => {
          if (nuovo.state === 'activated' && cera) avviso(T('Nuova versione di folio pronta.'), T('Ricarica'), () => location.reload(), 20000);
        });
      });
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => {});
  }
}

/* appiglio per i controlli automatici */
window.__prova = {
  mdVersoHtml, htmlVersoMd, titoloLibero, creaZip, ripulisci, nomeUnico, timbroNome,
  stato: () => A, apri, nuovoFoglio, cestinaFogli, entraSelezione, apriCestino, scadenzeCestino,
  fileEsportazione, collassaTutto, apriGrezzo, chiudiGrezzo, rientra, forseRichiamo, dialogoCollega, comando,
  commutaPreferito, disegnaSommario, commutaPiega, commutaTutte, mostraTitolo, evidenziaRicerca, testoSemplice, testoMd, condividiFogli, ripristinaScelti,
  disegnaCestino, menuFoglio, preferiti, disegnaLato, normalizzaElenchi, spostaRiga, spostaColonna, dialogoPassword, annulla, rifai, cancellaCasella, rigaInFondo, cambiaVolume, rinominaRimandi,
  impostaModo, filtroVuoto: () => { filtro = ''; }, spunta, righeScelte, invioSuCasella, dopoInvio,
  impostaPassword, sblocca, blocca, proteggi, sproteggi, perSalvare, aggiornaCifre, salvaOra, chiuso, dispostaBarra, posizionaLibera,
  pannelloImpostazioni, esportaJson, unisci, mdDi, sbloccato,
  T, applicaLingua, lingua: () => LINGUA, allinea, mettiImmagine, selezionaImmagine, comandoImmagine, immagineScelta: () => immagineScelta,
  segnapostoImmagini, idsImmagini, conImmagini, salvaImmaginiImportate, pulisciImmagini, urlImmagini, datiImmagini, htmlCorpo,
  scegliIcona, iconaGruppo, ICONE_GRUPPI, ordinaPer, riordinaSecondo, entraRiordino, esciRiordino, spostaGruppo, sezioniDi,
  dialogoImmagine, esportaMd, menuSezione, menuQuaderno,
  scriviCorrente, importaTesti: (testi, sid) => {
    testi.forEach(x => A.fogli.push({ id:id(), sezioneId:sid, titolo:titoloLibero(x.titolo), md:x.md, creata:oggi(), modificata:oggi() }));
    salva(); disegnaLato();
  }
};

/* lo splash si vede all'apertura dell'app, non quando il browser ricarica la pagina nella stessa sessione */
try {
  if (sessionStorage.getItem('folio.aperta')){ const s = $('#splash'); if (s) s.remove(); }
  sessionStorage.setItem('folio.aperta', '1');
} catch(e){}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', avvia);
else avvia();

})();
</script>
