    st.innerHTML = ICONE.stella();
    st.onclick = e => { e.stopPropagation(); commutaPreferito(p); };
    b.appendChild(st);
  }
  return b;
}

function commutaPreferito(p){
  p.preferito = !p.preferito;
  salva(); disegnaLato();
  avviso(p.preferito ? T('Aggiunto ai preferiti.') : T('Tolto dai preferiti.'));
}

/* ============ ricerca: risultati ordinati per Quaderno e Gruppo ============ */
function segnaTesto(testo, q){
  const frammento = document.createDocumentFragment();
  const base = senzaAccenti(testo), cerca = senzaAccenti(q);
  let i = 0;
  while (true){
    const j = cerca ? base.indexOf(cerca, i) : -1;
    if (j < 0){ frammento.appendChild(document.createTextNode(testo.slice(i))); break; }
    if (j > i) frammento.appendChild(document.createTextNode(testo.slice(i, j)));
    frammento.appendChild(el('span','marca', testo.slice(j, j + q.length)));
    i = j + q.length;
  }
  return frammento;
}

/* la ricerca, prima di scrivere: gli ultimi Fogli aperti, con data e ora */
function disegnaRecenti(albero){
  albero.appendChild(el('p','riassunto-ricerca',T('Ultimi aperti')));
  const lista = el('div','fogli recenti');
  A.impostazioni.recenti.forEach(x => {
    const p = foglio(x.id);
    if (!p || chiuso(p) || lista.children.length >= 20) return;
    lista.appendChild(voce(p, el('span','frammento',T('aperto {quando}', { quando:dataBreve(x.quando) })), true));
  });
  if (!lista.children.length) lista.appendChild(el('p','vuoto',T('Nessun Foglio aperto di recente.')));
  albero.appendChild(lista);
}

function disegnaRicerca(albero){
  const q = filtro.trim();
  const qn = senzaAccenti(q);
  const contiene = t => senzaAccenti(String(t || '')).includes(qn);
  const esiti = [];
  A.quaderni.forEach(vol => {
    sezioniDi(vol.id).forEach(cap => {
      /* un Foglio protetto chiuso non si trova: né il titolo né il testo */
      const fg = fogliDi(cap.id).filter(p => !chiuso(p) && (contiene(p.titolo) || contiene(p.md)));
      const capCorrisponde = contiene(cap.nome), volCorrisponde = contiene(vol.nome);
      if (!fg.length && !capCorrisponde && !volCorrisponde) return;
      esiti.push({ vol, cap, fogli: fg, capCorrisponde, volCorrisponde });
    });
  });
  if (!esiti.length){ albero.appendChild(el('p','vuoto',T('Niente contiene "{q}".', { q }))); return; }

  const totFogli = esiti.reduce((n,g) => n + g.fogli.length, 0);
  const nomi = esiti.filter(g => g.capCorrisponde || g.volCorrisponde).length;
  const parti = [];
  if (totFogli) parti.push(tn(totFogli, 'Foglio', 'Fogli'));
  if (nomi) parti.push(tn(nomi, 'nome di Gruppo o Quaderno', 'nomi di Gruppo o Quaderno'));
  albero.appendChild(el('p','riassunto-ricerca', parti.join(', ') + '.'));

  esiti.forEach(g => {
    const box = el('div','gruppo-ricerca');
    const capo = el('div','titolo-ricerca');
    const nomeVol = el('span'); nomeVol.appendChild(segnaTesto(g.vol.nome, q));
    const nomeCap = el('span','dove2'); nomeCap.appendChild(segnaTesto(g.cap.nome, q));
    capo.append(nomeVol, el('span','dove2','/'), nomeCap);
    box.appendChild(capo);
    const lista = el('div','fogli');
    if (!g.fogli.length && (g.capCorrisponde || g.volCorrisponde)){
      lista.appendChild(el('p','vuoto',g.capCorrisponde ? T('Corrisponde il nome del Gruppo.') : T('Corrisponde il nome del Quaderno.')));
    }
    g.fogli.forEach(p => {
      const dove = contiene(p.titolo) ? 'nel titolo' : 'nel testo';
      const fr = el('span','frammento');
      if (dove === 'nel testo'){
        const testo = senzaAccenti(p.md), i = testo.indexOf(qn);
        const inizio = Math.max(0, i - 24);
        const pezzo = p.md.slice(inizio, i + q.length + 46).replace(/\s+/g,' ').trim();
        fr.appendChild(document.createTextNode(inizio > 0 ? '…' : ''));
        fr.appendChild(segnaTesto(pezzo, q));
        fr.appendChild(document.createTextNode('…'));
      } else {
        fr.textContent = T('corrisponde il titolo');
      }
      const v = voce(p, fr);
      const tit = v.querySelector('.tit > span');
      if (dove === 'nel titolo'){ tit.textContent = ''; tit.appendChild(segnaTesto(p.titolo, q)); }
      lista.appendChild(v);
    });
    box.appendChild(lista);
    albero.appendChild(box);
  });
}

/* ============ selezione ============ */
function entraSelezione(tipo){
  scelti = new Set();
  tipoSel = tipo || 'fogli';
  [...$('#segmenti').children].forEach(b => b.classList.toggle('scelto', b.dataset.tipo === tipoSel));
  impostaModo('selezione');
  vista('elenco');
  disegnaLato();
}
function esciSelezione(){
  scelti = new Set();
  impostaModo('normale');
  disegnaLato();
}
function commuta(x){ scelti.has(x) ? scelti.delete(x) : scelti.add(x); disegnaLato(); }
function tutteLeVoci(ids){
  const tutte = ids.every(i => scelti.has(i));
  ids.forEach(i => tutte ? scelti.delete(i) : scelti.add(i));
  disegnaLato();
}
function aggiornaConta(){
  if (modo !== 'selezione') return;
  const n = scelti.size;
  $('#contaSel').textContent = n ? (tipoSel === 'fogli' ? tn(n, 'Foglio', 'Fogli') : tn(n, 'Gruppo', 'Gruppi')) : T('niente');
  $('#bSposta').disabled = !n;
  $('#bElimina').disabled = !n;
  $('#bCondividi').disabled = !n;
}
function elementiScelti(){
  return tipoSel === 'fogli'
    ? A.fogli.filter(p => scelti.has(p.id))
    : A.sezioni.filter(s => scelti.has(s.id));
}

function commutaSezione(sid){
  const c = new Set(A.impostazioni.sezioniChiuse);
  c.has(sid) ? c.delete(sid) : c.add(sid);
  A.impostazioni.sezioniChiuse = [...c];
  salvaPresto(); disegnaLato();
}
function collassaTutto(){
  const sezioni = sezioniDi(A.impostazioni.quaderno);
  const c = new Set(A.impostazioni.sezioniChiuse);
  const tutteChiuse = sezioni.every(s => c.has(s.id));
  sezioni.forEach(s => tutteChiuse ? c.delete(s.id) : c.add(s.id));
  A.impostazioni.sezioniChiuse = [...c];
  salva(); disegnaLato();
}
/* ============ apertura e scrittura del foglio ============ */
function apri(fid){
  const voluto = foglio(fid);
  if (chiuso(voluto)){ seAperto(voluto, () => apri(fid)); return; }
  chiudiGrezzo();
  finalizzaTitolo();
  scriviCorrente();
  const p = foglio(fid);
  if (!p){ mostraVuoto(); return; }
  corrente = p;
  A.impostazioni.foglio = p.id;
  /* ultimi aperti: in cima il più recente, con data e ora */
  A.impostazioni.recenti = [{ id:p.id, quando:oggi() }].concat(A.impostazioni.recenti.filter(x => x.id !== p.id)).slice(0, 30);
  const s = sezione(p.sezioneId);
  if (s && s.quadernoId !== A.impostazioni.quaderno) A.impostazioni.quaderno = s.quadernoId;
  $('#foglio').classList.remove('nascosto');
  $('#senzaFoglio').classList.add('nascosto');
  $('#strumenti').classList.remove('nascosto');

  $('#titolo').value = p.titolo;
  $('#corpo').innerHTML = mdVersoHtml(p.md) || '<p><br></p>';
  applicaAllineamento();
  azzeraPassi();
  togliManiglie();
  disegnaSommario();
  htmlAperto = $('#corpo').innerHTML;
  riempiImmagini();
  aggiornaBarraImmagine();

  vista('foglio');
  disegnaLato();
  $('#zona').scrollTop = 0;

  salvaPresto();
}

/* ============ sommario e paragrafi pieghevoli ============ */
/* Il sommario nasce dai titoli (H1, H2, H3) appena ce n'è uno, sta fermo sotto la barra in alto
   e non viene mai scritto dentro al file. Ogni titolo ha a destra una freccia che chiude o apre
   il suo paragrafo, cioè tutto quello che c'è fino al titolo successivo dello stesso livello o più alto.
   Quali paragrafi sono chiusi si ricorda finché l'app resta aperta. */
let titoliSommario = [];
const piegati = new Map();                         /* id del Foglio -> titoli chiusi */
const livello = n => /^H[1-3]$/.test(n.nodeName) ? +n.nodeName[1] : 0;
function insiemePiegati(){
  if (!corrente) return new Set();
  if (!piegati.has(corrente.id)) piegati.set(corrente.id, new Set());
  return piegati.get(corrente.id);
}
/* la chiave di un titolo: livello, testo e quante volte lo stesso titolo è già comparso */
function chiaviTitoli(){
  const conta = {};
  return titoliSommario.map(h => { const b = h.nodeName + '|' + h.textContent.trim(); conta[b] = (conta[b] || 0) + 1; return b + '|' + conta[b]; });
}
function applicaPieghe(){
  const insieme = insiemePiegati(), chiavi = chiaviTitoli();
  const chiusi = new Set(titoliSommario.filter((h, i) => insieme.has(chiavi[i])));
  let fino = null;
  [...corpo().children].forEach(n => {
    const liv = livello(n);
    if (liv && (fino === null || liv <= fino)){
      fino = chiusi.has(n) ? liv : null;
      n.classList.toggle('piegato', false);       /* toggle e non remove: non lascia attributi vuoti */
      n.classList.toggle('capo-piegato', chiusi.has(n));
      return;
    }
    n.classList.toggle('piegato', fino !== null);
    if (liv) n.classList.toggle('capo-piegato', chiusi.has(n));
  });
  /* il cursore non resta mai dentro a un paragrafo chiuso */
  const s = getSelection();
  const dove = s.rangeCount && s.anchorNode && corpo().contains(s.anchorNode) ? (s.anchorNode.nodeType === 3 ? s.anchorNode.parentNode : s.anchorNode).closest('.piegato') : null;
  if (dove){
    let h = dove.previousElementSibling;
    while (h && (h.classList.contains('piegato') || !livello(h))) h = h.previousElementSibling;
    if (h){ const r = document.createRange(); r.selectNodeContents(h); r.collapse(false); s.removeAllRanges(); s.addRange(r); }
  }
}
function commutaPiega(h){
  const i = titoliSommario.indexOf(h);
  if (i < 0) return;
  const k = chiaviTitoli()[i], insieme = insiemePiegati();
  insieme.has(k) ? insieme.delete(k) : insieme.add(k);
  applicaPieghe(); disegnaSommario();
}
function commutaTutte(){
  const insieme = insiemePiegati(), chiavi = chiaviTitoli();
  const tutte = chiavi.length && chiavi.every(k => insieme.has(k));
  insieme.clear();
  if (!tutte) chiavi.forEach(k => insieme.add(k));
  applicaPieghe(); disegnaSommario();
}
/* per andare a un titolo nascosto si aprono i paragrafi che lo contengono */
function mostraTitolo(h){
  if (h.classList.contains('piegato')){
    const insieme = insiemePiegati(), chiavi = chiaviTitoli();
    let min = livello(h);
    for (let n = h.previousElementSibling; n; n = n.previousElementSibling){
      const l = livello(n);
      if (l && l < min){ insieme.delete(chiavi[titoliSommario.indexOf(n)]); min = l; }
    }
    applicaPieghe(); disegnaSommario();
  }
  h.scrollIntoView({ block:'start', behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth' });
}
/* la freccia di un titolo sta all'estremo destro della sua riga */
function zonaPiega(bersaglio, x){
  const h = bersaglio && bersaglio.closest ? bersaglio.closest('h1,h2,h3') : null;
  if (!h || h.parentNode !== corpo()) return null;
  return x > h.getBoundingClientRect().right - 40 ? h : null;
}
function disegnaSommario(){
  const box = $('#sommario');
  titoliSommario = corrente ? [...corpo().children].filter(livello) : [];
  applicaPieghe();
  if (!corrente || !A.impostazioni.sommario || vistaGrezza || !titoliSommario.length){ box.classList.add('nascosto'); return; }
  const aperto = A.impostazioni.sommarioAperto;
  const insieme = insiemePiegati(), chiavi = chiaviTitoli();
  const tutteChiuse = chiavi.every(k => insieme.has(k));
  box.innerHTML = '';
  const capo = el('div','capo');
  const apri2 = el('button','apri-som');
  apri2.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 7h14M8 12h11M11 17h8"/></svg>';
  apri2.appendChild(el('span', null, T('In questo Foglio')));
  apri2.appendChild(el('span','conta', String(titoliSommario.length)));
  apri2.onclick = () => { A.impostazioni.sommarioAperto = !aperto; salvaPresto(); disegnaSommario(); };
  const tutte = el('button','mini');
  tutte.title = tutteChiuse ? T('Apri tutti i paragrafi') : T('Chiudi tutti i paragrafi');
  tutte.setAttribute('aria-label', tutte.title);
  tutte.innerHTML = ICONE.doppia(tutteChiuse ? 'giu' : 'su');
  tutte.onclick = commutaTutte;
  const frec = el('button','mini');
  frec.title = aperto ? T('Riduci il sommario') : T('Mostra il sommario');
  frec.setAttribute('aria-label', frec.title);
  frec.innerHTML = ICONE.freccia(aperto ? 'su' : 'giu');
  frec.onclick = apri2.onclick;
  [apri2, tutte, frec].forEach(b => b.addEventListener('mousedown', e => e.preventDefault()));
  capo.append(apri2, tutte, frec);
  box.appendChild(capo);
  if (aperto){
    const ol = document.createElement('ol');
    const minimo = Math.min(...titoliSommario.map(livello));     /* il rientro parte dal titolo più alto presente */
    titoliSommario.forEach((h, i) => {
      const li = document.createElement('li');
      const b = el('button','voce-som liv' + (livello(h) - minimo + 1) + (insieme.has(chiavi[i]) ? ' chiusa' : ''), h.textContent.trim() || T('senza titolo'));
      b.onclick = () => mostraTitolo(h);
      li.appendChild(b); ol.appendChild(li);
    });
    box.appendChild(ol);
  }
  box.classList.remove('nascosto');
}
/* titoli e sommario si aggiornano mentre si scrive, una volta per fotogramma */
let titoliInArrivo = false;
function pianificaTitoli(){
  if (titoliInArrivo) return;
  titoliInArrivo = true;
  requestAnimationFrame(() => { titoliInArrivo = false; if (corrente && !vistaGrezza) disegnaSommario(); });
}

/* dopo una ricerca il termine viene selezionato nel foglio, come con il mouse */
function evidenziaRicerca(q){
  if (!q || !corrente) return;
  const cerca = senzaAccenti(q);
  const camm = document.createTreeWalker($('#corpo'), NodeFilter.SHOW_TEXT);
  let n;
  while ((n = camm.nextNode())){
    const i = senzaAccenti(n.nodeValue).indexOf(cerca);
    if (i < 0) continue;
    const r = document.createRange();
    r.setStart(n, i); r.setEnd(n, Math.min(n.nodeValue.length, i + q.length));
    const s = getSelection();
    s.removeAllRanges(); s.addRange(r);
    const madre = n.parentElement;
    if (madre) madre.scrollIntoView({ block:'center', behavior:'auto' });
    return;
  }
}
function togliEvidenza(){
  const s = getSelection();
  if (s && s.rangeCount && $('#corpo').contains(s.anchorNode)) s.removeAllRanges();
}

function aggiornaVuoto(){
  const c = $('#corpo');
  c.dataset.vuoto = (c.textContent.trim() === '' && !c.querySelector('img,table,hr,input')) ? '1' : '0';
}

/* il markdown viene riscritto solo se il contenuto è cambiato davvero:
   aprire e chiudere un foglio importato non ne altera la forma originale */
function scriviCorrente(){
  if (!corrente) return;
  if (vistaGrezza){
    const testo = $('#grezzo').value;
    if (testo !== corrente.md){ corrente.md = testo; corrente.modificata = oggi(); }
    return;
  }
  const t = $('#titolo').value.trim();
  let cambiato = false;
  if (t && t !== corrente.titolo){ corrente.titolo = t; cambiato = true; }
  const htmlOra = htmlCorpo();
  if (htmlOra !== htmlAperto){
    const md = htmlVersoMd(htmlOra);
    if (md !== corrente.md){ corrente.md = md; cambiato = true; }
    htmlAperto = htmlOra;
  }
  if (cambiato) corrente.modificata = oggi();
}

function finalizzaTitolo(){
  if (!corrente || vistaGrezza) return;
  const grezzo = $('#titolo').value.trim();
  const t = titoloLibero(grezzo, corrente.id);
  const daRinominare = titoloPrima && titoloPrima !== t;
  if (t !== corrente.titolo || t !== grezzo || daRinominare){
    if (daRinominare) rinominaRimandi(titoloPrima, t);
    corrente.titolo = t; corrente.modificata = oggi();
    $('#titolo').value = t;
    salva(); disegnaLato(); disegnaRimandi();
  }
  titoloPrima = t;
}

const registra = rimbalzo(() => {
  if (!corrente) return;
  scriviCorrente();
  disegnaSommario();
  $('#metaFoglio').textContent = T('Modificato {quando}', { quando:dataBreve(corrente.modificata) });
  salva();
  disegnaLato();
  disegnaRimandi();
}, 700);

function rinominaRimandi(vecchio, nuovo){
  const c = senzaAccenti(vecchio).trim();
  let toccati = 0;
  A.fogli.forEach(p => {
    if (corrente && p.id === corrente.id) return;
    const md = p.md.replace(/\[\[([^\[\]]+)\]\]/g, (m,n) => senzaAccenti(n).trim() === c ? '[[' + nuovo + ']]' : m);
    if (md !== p.md){ p.md = md; toccati++; }
  });
  if (toccati) avviso(T('Collegamenti aggiornati in {n}.', { n:tn(toccati, 'Foglio', 'Fogli') }));
  /* i Fogli protetti chiusi non si possono aggiornare: se si sa che lo richiamano, lo si dice */
  if (rimandiProtetti && rimandiProtetti.has(c) && tuttiIFogli().some(p => p.protetto && chiuso(p))){
    avvisoRimandiChiusi(vecchio, nuovo);
  }
}
function avvisoRimandiChiusi(vecchio, nuovo){
  dialogo(T('Collegamenti nei Fogli protetti'), (box, chiudi, pie) => {
    box.appendChild(el('p', null, T('Un Foglio protetto, ora chiuso, richiama "{nome}". Finché resta chiuso, il suo collegamento punta al vecchio nome.', { nome:vecchio })));
    const a = el('button','bott',T('Lascia così')); a.onclick = chiudi;
    const b = el('button','bott pieno',T('Aprili e aggiorna'));
    b.onclick = () => { chiudi(); chiediSblocco(() => { rinominaRimandi(vecchio, nuovo); salva(); }); };
    pie.append(a, b);
  }, null, null, { pieLibero:true });
}

function disegnaRimandi(){
  const box = $('#rimandi');
  if (!corrente || vistaGrezza){ box.classList.add('nascosto'); return; }
  const v = rimandiA(corrente);
  if (!v.length){ box.classList.add('nascosto'); return; }
  box.innerHTML = '';
  box.appendChild(el('span', null, T('Citato in: ')));
  v.forEach(p => {
    const a = el('a', null, p.titolo);
    a.onclick = () => apri(p.id);
    const s = el('span'); s.appendChild(a); box.appendChild(s);
  });
  box.classList.remove('nascosto');
}

/* ============ vista testo: markdown grezzo, senza conversioni ============ */
function apriGrezzo(){
  if (!corrente || vistaGrezza) return;
  scriviCorrente();
  vistaGrezza = true;
  $('#grezzo').value = corrente.md;
  $('#grezzo').classList.remove('nascosto');
  $('#corpo').classList.add('nascosto');
  togliManiglie();
  selezionaImmagine(null);
  $('#sommario').classList.add('nascosto');

  $('#rimandi').classList.add('nascosto');

}
function chiudiGrezzo(){
  if (!vistaGrezza) return;
  const testo = $('#grezzo').value;
  if (corrente && testo !== corrente.md){ corrente.md = testo; corrente.modificata = oggi(); }
  vistaGrezza = false;
  $('#grezzo').classList.add('nascosto');

/* ============ creazione ============ */
function nuovoFoglio(sid){
  const sezioni = sezioniDi(A.impostazioni.quaderno);
  const dove = sid || (corrente ? corrente.sezioneId : null) || (sezioni[0] && sezioni[0].id);
  if (!dove){ nuovaSezione(); return; }
  const p = { id:id(), sezioneId:dove, titolo:titoloLibero(''), md:'', creata:oggi(), modificata:oggi() };
  A.fogli.push(p);
  salva(); apri(p.id);
  const t = $('#titolo'); t.focus(); t.select();
}

function nuovaSezione(){
  const nome = nomeSezioneLibero(A.impostazioni.quaderno, '');
  const s = { id:id(), quadernoId:A.impostazioni.quaderno, nome, creata:oggi() };
  A.sezioni.push(s); salva(); disegnaLato();
  avviso(T('Gruppo creato.'), T('Rinomina'), () => rinominaSezione(s));
}

function nuovoQuaderno(){
  const q = { id:id(), nome:nomeQuadernoLibero(''), creato:oggi() };
  A.quaderni.push(q);
  A.sezioni.push({ id:id(), quadernoId:q.id, nome:nomeSezioneLibero(q.id,''), creata:oggi() });
  A.impostazioni.quaderno = q.id;
  mostraVuoto(); salva(); disegnaLato(); vista('elenco');
  avviso(T('Quaderno creato.'), T('Rinomina'), () => rinominaQuaderno(q));
}

function rinominaSezione(s){
  chiediTesto(T('Rinomina Gruppo'),T('Nome'), s.nome, n => {
    const t = String(n).trim(); if (!t || t === s.nome) return;
    s.nome = nomeSezioneLibero(s.quadernoId, t); salva(); disegnaLato(); if (corrente) apri(corrente.id);
  });
}
function rinominaQuaderno(q){
  chiediTesto(T('Rinomina Quaderno'),T('Nome'), q.nome, n => {
    const t = String(n).trim(); if (!t || t === q.nome) return;
    q.nome = nomeQuadernoLibero(t); salva(); disegnaLato(); if (corrente) apri(corrente.id);
  });
}

/* ============ cestino: eliminazione e ripristino ============ */
function cestinaFogli(fg, silenzioso){
  if (!fg.length) return;
  const q = quadernoDiFoglio(fg[0]);
  fg.forEach(p => {
    const s = sezione(p.sezioneId), qd = s ? quaderno(s.quadernoId) : null;
    const i = A.fogli.indexOf(p);
    if (i >= 0) A.fogli.splice(i,1);
    A.cestino.fogli.push(Object.assign({}, p, {
      eliminato: oggi(), sezioneNome: s ? s.nome : '', quadernoNome: qd ? qd.nome : ''
    }));
    if (corrente && corrente.id === p.id) mostraVuoto();
  });
  salva(); disegnaLato();
  if (!silenzioso) avviso(T('{n} nel cestino.', { n:tn(fg.length, 'Foglio', 'Fogli') }), T('Annulla'), () => {
    fg.forEach(p => ripristinaFoglio(A.cestino.fogli.find(x => x.id === p.id), true));
    salva(); disegnaLato();
  }, 8000);
  return q;
}

function cestinaSezioni(sez, conFogli, destinazione){
  let spostati = 0, cestinati = 0;
  sez.forEach(s => {
    const suoi = A.fogli.filter(p => p.sezioneId === s.id);
    if (conFogli){
      suoi.forEach(p => {
        const i = A.fogli.indexOf(p); if (i >= 0) A.fogli.splice(i,1);
        if (corrente && corrente.id === p.id) mostraVuoto();
      });
      cestinati += suoi.length;
      A.cestino.sezioni.push(Object.assign({}, s, { eliminata:oggi(), quadernoNome:(quaderno(s.quadernoId)||{}).nome || '', fogli:suoi }));
    } else {
      suoi.forEach(p => { p.sezioneId = destinazione; spostati++; });
      A.cestino.sezioni.push(Object.assign({}, s, { eliminata:oggi(), quadernoNome:(quaderno(s.quadernoId)||{}).nome || '', fogli:[] }));
    }
    const j = A.sezioni.indexOf(s); if (j >= 0) A.sezioni.splice(j,1);
  });
  salva(); disegnaLato();
  const parti = [T('{n} nel cestino', { n:tn(sez.length, 'Gruppo', 'Gruppi') })];
  if (cestinati) parti.push(T('{n} dentro', { n:tn(cestinati, 'Foglio', 'Fogli') }));
  if (spostati) parti.push(tn(spostati, 'Foglio spostato', 'Fogli spostati'));
  avviso(parti.join(', ') + '.');
}

function ripristinaFoglio(p, silenzioso){
  if (!p) return;
  const i = A.cestino.fogli.indexOf(p);
  if (i >= 0) A.cestino.fogli.splice(i,1);
  const copia = Object.assign({}, p);
  delete copia.eliminato; delete copia.sezioneNome; delete copia.quadernoNome;
  if (!sezione(copia.sezioneId)) copia.sezioneId = A.sezioni[0].id;
  copia.titolo = titoloLibero(copia.titolo, copia.id);
  A.fogli.push(copia);
  if (!silenzioso){ salva(); disegnaCestino(); avviso(T('Foglio ripristinato.')); }
  return copia;
}

function ripristinaSezione(s, silenzioso){
  const i = A.cestino.sezioni.indexOf(s);
  if (i >= 0) A.cestino.sezioni.splice(i,1);
  const copia = Object.assign({}, s);
  delete copia.eliminata; delete copia.quadernoNome; delete copia.fogli;
  if (!quaderno(copia.quadernoId)) copia.quadernoId = A.quaderni[0].id;
  copia.nome = nomeSezioneLibero(copia.quadernoId, copia.nome);
  A.sezioni.push(copia);
  (s.fogli || []).forEach(p => {
    const c = Object.assign({}, p, { sezioneId: copia.id });
    c.titolo = titoloLibero(c.titolo, c.id);
    A.fogli.push(c);
  });
  if (!silenzioso){ salva(); disegnaCestino(); avviso(T('Gruppo ripristinato.')); }
}
/* ============ editor: comandi ============ */
const corpo = () => $('#corpo');
function dentro(){ const s = getSelection(); return s.rangeCount && corpo().contains(s.anchorNode); }
function assicuraFuoco(){
  if (!dentro()){
    corpo().focus();
    const s = getSelection();
    if (!s.rangeCount){ const r = document.createRange(); r.selectNodeContents(corpo()); r.collapse(false); s.addRange(r); }
  }
}
function blocco(){
  let n = getSelection().anchorNode;
  if (!n) return null;
  if (n.nodeType === 3) n = n.parentNode;
  while (n && n !== corpo() && n.parentNode !== corpo()) n = n.parentNode;
  return n === corpo() ? null : n;
}
function esegui(c,v){ document.execCommand(c, false, v); }

function comando(nome){
  assicuraFuoco();
  if (nome === 'annulla'){ annulla(); return; }
  segnaPasso('comando');
  switch(nome){
    case 'grassetto': esegui('bold'); break;
    case 'corsivo': esegui('italic'); break;
    case 'barrato': esegui('strikeThrough'); break;
    case 'h1': case 'h2': case 'h3': {
      const b = blocco();
      esegui('formatBlock', (b && b.nodeName.toLowerCase() === nome) ? 'p' : nome);
      break;
    }
    case 'citazione': {
      const b = blocco();
      esegui('formatBlock', (b && b.closest && b.closest('blockquote')) ? 'p' : 'blockquote');
      break;
    }
    case 'codice': codiceSelezione(); break;
    case 'elenco': esegui('insertUnorderedList'); ripuliscElenco(); break;
    case 'numerato': esegui('insertOrderedList'); ripuliscElenco(); break;
    case 'rientro': rientra(1); break;
    case 'sporgenza': rientra(-1); break;
    case 'spunta': spunta(); break;
    case 'riga': esegui('insertHorizontalRule'); break;
    case 'tabella': inserisciTabella(); break;
    case 'allinea': allinea(); break;
    case 'collega': dialogoCollega(); break;
  }
  dopoModifica();
}

/* allineamento: vale per tutto il Foglio, per tipo di blocco. Con il cursore su un paragrafo il
   pulsante allinea tutti i paragrafi; su un titolo, tutti i titoli dello stesso livello (H1, H2 o H3).
   Ogni tocco passa al successivo: a sinistra, al centro, a destra, giustificato. Si salva fra i dati
   del Foglio (p.allinea), non dentro al testo: il markdown resta pulito. I paragrafi con sole
   immagini seguono la barra dell'immagine. */
const GIRO_ALLINEA = ['left','center','right','justify'];
const TIPI_ALLINEA = { P:'p', H1:'h1', H2:'h2', H3:'h3' };
const allineamentoDi = b => GIRO_ALLINEA.includes(b && b.getAttribute && b.getAttribute('align')) ? b.getAttribute('align') : 'left';
const soloImmagine = n => n.nodeName === 'P' && !!n.querySelector('img') && !n.textContent.trim();
function tipoAllineabile(b){
  if (!b || b.parentNode !== corpo()) return null;
  const k = TIPI_ALLINEA[b.nodeName];
  return k && !(k === 'p' && soloImmagine(b)) ? k : null;
}
/* quello che si vede: l'allineamento scritto nel blocco (Fogli della 7.4, immagini) o quello del Foglio */
function allineamentoEffettivo(b){
  const k = tipoAllineabile(b);
  if (!k) return allineamentoDi(b);
  if (b.hasAttribute('align') && allineamentoDi(b) !== 'left') return allineamentoDi(b);
  return (corrente && corrente.allinea && corrente.allinea[k]) || 'left';
}
function applicaAllineamento(){
  const al = (corrente && corrente.allinea) || {};
  ['p','h1','h2','h3'].forEach(k => al[k] ? corpo().setAttribute('data-al-' + k, al[k]) : corpo().removeAttribute('data-al-' + k));
}
function allinea(){
  const b = blocco(), k = tipoAllineabile(b);
  if (!k || !corrente){ avviso(T('L\'allineamento vale per paragrafi e titoli.')); return; }
  const al = Object.assign({}, corrente.allinea);
  const dopo = GIRO_ALLINEA[(GIRO_ALLINEA.indexOf(allineamentoEffettivo(b)) + 1) % GIRO_ALLINEA.length];
  if (dopo === 'left') delete al[k]; else al[k] = dopo;
  if (Object.keys(al).length) corrente.allinea = al; else delete corrente.allinea;
  /* gli allineamenti scritti blocco per blocco (7.4) lasciano il posto a quello del Foglio */
  [...corpo().children].forEach(n => { if (n.hasAttribute('align') && tipoAllineabile(n) === k) n.removeAttribute('align'); });
  corrente.modificata = oggi();
  applicaAllineamento();
}

function codiceSelezione(){
  const s = getSelection();
  const n = s.anchorNode && (s.anchorNode.nodeType === 3 ? s.anchorNode.parentNode : s.anchorNode);
  const c = n && n.closest && n.closest('code');
  if (c){ const t = document.createTextNode(c.textContent); c.parentNode.replaceChild(t, c); return; }
  if (s.isCollapsed){ esegui('insertHTML','<code>' + fuga(T('codice')) + '</code>&nbsp;'); return; }
  esegui('insertHTML','<code>' + fuga(s.toString()) + '</code>');
}

/* il rientro vale solo dentro un elenco: fuori, "indent" produrrebbe una citazione */
function rientra(verso){
  const n = getSelection().anchorNode;
  const base = n && (n.nodeType === 3 ? n.parentNode : n);
  const li = base && base.closest ? base.closest('li') : null;
  if (!li){ avviso(T('Il rientro funziona dentro un elenco.')); return; }
  if (verso > 0 && !li.previousElementSibling){ avviso(T('Serve una voce sopra a cui agganciarsi.')); return; }
  esegui(verso > 0 ? 'indent' : 'outdent');
  corpo().querySelectorAll('blockquote').forEach(b => {
    if (b.querySelector('ul,ol') && !b.dataset.voluta){
      const padre = b.parentNode;
      while (b.firstChild) padre.insertBefore(b.firstChild, b);
      b.remove();
    }
  });
  tieniCursore(() => normalizzaElenchi(corpo()));
  ripuliscElenco();
}

/* spostare nodi fa perdere il cursore: lo si annota e lo si rimette dove era */
function tieniCursore(fai){
  const s = getSelection();
  const r = s.rangeCount ? s.getRangeAt(0) : null;
  const punti = r ? [r.startContainer, r.startOffset, r.endContainer, r.endOffset] : null;
  fai();
  if (!punti) return;
  try {
    const n = document.createRange();
    n.setStart(punti[0], punti[1]); n.setEnd(punti[2], punti[3]);
    s.removeAllRanges(); s.addRange(n);
  } catch(e){}
}

function ripuliscElenco(){
  corpo().querySelectorAll('li').forEach(li => {
    li.classList.toggle('spunta-voce', !!li.querySelector(':scope > input[type=checkbox]'));
  });
}

/* ============ annulla: ogni modifica, anche quelle fatte da folio, si può disfare ============ */
/* Prima di ogni modifica si mette da parte una fotografia del Foglio (testo e cursore).
   La scrittura continua conta come un passo solo: si spezza dopo una pausa o cambiando gesto. */
let passi = [], rifatti = [], ultimoPasso = 0, ultimoTipo = '';
function percorso(n){
  const p = [];
  while (n && n !== corpo()){ if (!n.parentNode) return null; p.unshift([...n.parentNode.childNodes].indexOf(n)); n = n.parentNode; }
  return n ? p : null;
}
function nodoDa(p){ let n = corpo(); for (const i of p){ n = n && n.childNodes[i]; } return n; }
function fotografia(){
  const s = getSelection();
  let cur = null;
  if (s.rangeCount && corpo().contains(s.anchorNode)){
    const r = s.getRangeAt(0);
    cur = [percorso(r.startContainer), r.startOffset, percorso(r.endContainer), r.endOffset];
  }
  return { html: htmlCorpo(), cur, al: corrente && corrente.allinea ? JSON.stringify(corrente.allinea) : '' };
}
function segnaPasso(tipo){
  if (!corrente || vistaGrezza) return;
  const ora = Date.now();
  if (tipo === 'scrivi' && ultimoTipo === 'scrivi' && ora - ultimoPasso < 1200){ ultimoPasso = ora; return; }
  ultimoPasso = ora; ultimoTipo = tipo;
  const f = fotografia();
  if (passi.length && passi[passi.length - 1].html === f.html && passi[passi.length - 1].al === f.al) return;
  passi.push(f);
  if (passi.length > 150) passi.shift();
  rifatti = [];
}
function rimetti(f){
  corpo().innerHTML = f.html;
  if (corrente){ if (f.al) corrente.allinea = JSON.parse(f.al); else delete corrente.allinea; applicaAllineamento(); }
  immagineScelta = null;
  riempiImmagini();
  aggiornaBarraImmagine();
  if (f.cur && f.cur[0] && f.cur[2]){
    try {
      const r = document.createRange();
      r.setStart(nodoDa(f.cur[0]), f.cur[1]); r.setEnd(nodoDa(f.cur[2]), f.cur[3]);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    } catch(e){ assicuraFuoco(); }
  }
  ultimoTipo = '';
  ripuliscElenco();
  dopoModifica();
  disegnaSommario();
}
function annulla(){
  if (!passi.length){ avviso(T('Niente da annullare.')); return; }
  rifatti.push(fotografia());
  rimetti(passi.pop());
}
function rifai(){
  if (!rifatti.length) return;
  passi.push(fotografia());
  rimetti(rifatti.pop());
}
function azzeraPassi(){ passi = []; rifatti = []; ultimoTipo = ''; }

/* ============ caselle ============ */
const casellaDi = li => li.querySelector(':scope > input[type=checkbox]');
function nuovaCasella(li){
  const c = document.createElement('input');
  c.type = 'checkbox';
  li.insertBefore(c, li.firstChild);
  return c;
}
/* la parte di una voce che è "la sua riga": tutto tranne i sotto-elenchi */
function rangeRiga(n){
  const r = document.createRange();
  r.selectNodeContents(n);
  if (n.nodeName === 'LI'){
    const sotto = [...n.childNodes].findIndex(x => x.nodeName === 'UL' || x.nodeName === 'OL');
    if (sotto >= 0) r.setEnd(n, sotto);
  }
  return r;
}
/* la riga tocca la selezione se finisce dopo il suo inizio e comincia prima della sua fine */
function tocca(sel, n){
  const r = rangeRiga(n);
  return r.compareBoundaryPoints(Range.START_TO_END, sel) > 0 && r.compareBoundaryPoints(Range.END_TO_START, sel) < 0;
}
/* le righe toccate dalla selezione: voci di elenco o paragrafi e titoli semplici */
function righeScelte(){
  const s = getSelection();
  if (!s.rangeCount || !corpo().contains(s.anchorNode)) return [];
  const r = s.getRangeAt(0);
  const semplice = n => /^(P|DIV|H1|H2|H3|H4|H5|H6)$/.test(n.nodeName) && !n.classList.contains('tabella-box');
  if (r.collapsed){
    const n = r.startContainer.nodeType === 3 ? r.startContainer.parentNode : r.startContainer;
    const li = n.closest ? n.closest('li') : null;
    if (li && corpo().contains(li)) return [li];
    const b = blocco();
    return b && semplice(b) ? [b] : [];
  }
  const voci = [...corpo().querySelectorAll('li')].filter(li => tocca(r, li));
  const blocchi = [...corpo().children].filter(b => semplice(b) && tocca(r, b));
  return blocchi.concat(voci);
}
function inVoce(b){
  const ul = document.createElement('ul'), li = document.createElement('li');
  while (b.firstChild) li.appendChild(b.firstChild);
  if (!li.firstChild) li.appendChild(document.createElement('br'));
  ul.appendChild(li);
  b.parentNode.replaceChild(ul, b);
  return li;
}
/* una voce di primo livello torna una riga di testo, dividendo l'elenco se serve */
function fuoriElenco(li){
  const lista = li.parentNode, genitore = lista.parentNode;
  const p = document.createElement('p'), sotto = [];
  [...li.childNodes].forEach(n => (n.nodeName === 'UL' || n.nodeName === 'OL') ? sotto.push(n) : p.appendChild(n));
  if (!p.firstChild) p.appendChild(document.createElement('br'));
  const dopo = [];
  for (let n = li.nextSibling; n; n = n.nextSibling) dopo.push(n);
  li.remove();
  const ancora = lista.nextSibling;
  genitore.insertBefore(p, ancora);
  sotto.forEach(x => genitore.insertBefore(x, ancora));
  if (dopo.length){
    const resto = document.createElement(lista.nodeName);
    dopo.forEach(x => resto.appendChild(x));
    genitore.insertBefore(resto, ancora);
  }
  if (!lista.children.length) lista.remove();
  return p;
}
function seleziona(primo, ultimo){
  const r = document.createRange();
  r.setStart(primo, 0); r.setEnd(ultimo, ultimo.childNodes.length);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}

/* un tocco: caselle vuote per tutte le righe; due: tutte spuntate; tre: niente caselle */
function spunta(){
  let righe = righeScelte();
  if (!righe.length) return;
  const eraSelezione = !getSelection().isCollapsed;
  if (righe.some(n => n.nodeName !== 'LI')){
    righe = righe.map(n => n.nodeName === 'LI' ? n : inVoce(n));
    tieniCursore(() => normalizzaElenchi(corpo()));
    if (eraSelezione) seleziona(righe[0], righe[righe.length - 1]);
  }
  const caselle = righe.map(casellaDi);
  if (caselle.some(c => !c)){
    righe.forEach(li => { if (!casellaDi(li)) nuovaCasella(li); });
    if (!eraSelezione) cursoreInFondo(righe[0]);
  } else if (caselle.some(c => !c.checked)){
    caselle.forEach(c => { c.checked = true; c.setAttribute('checked',''); });
  } else {
    caselle.forEach(c => c.remove());
    righe.forEach(li => li.classList.remove('spunta-voce'));
    const fuori = righe.filter(li => li.parentNode && li.parentNode.parentNode === corpo()).map(fuoriElenco);
    if (fuori.length) eraSelezione ? seleziona(fuori[0], fuori[fuori.length - 1]) : cursoreInFondo(fuori[0]);
  }
  ripuliscElenco();
}
function cursoreInFondo(n){
  const r = rangeRiga(n); r.collapse(false);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}

/* il cursore non sta mai prima della casella: lì il testo finirebbe davanti al quadratino */
function cursoreDopoCasella(){
  const s = getSelection();
  if (!s.rangeCount || !s.isCollapsed) return;
  const n = s.anchorNode;
  if (!n || !corpo().contains(n)) return;
  const li = n.nodeType === 1 && n.nodeName === 'LI' ? n : null;
  if (!li || s.anchorOffset !== 0) return;
  const c = casellaDi(li);
  if (!c || li.firstChild !== c) return;
  const r = document.createRange();
  r.setStartAfter(c); r.collapse(true);
  s.removeAllRanges(); s.addRange(r);
}
const testoRiga = li => [...li.childNodes].filter(x => x.nodeName !== 'UL' && x.nodeName !== 'OL').map(x => x.textContent).join('').replace(/\u00A0/g,' ').trim();
function voceCorrente(){
  const s = getSelection();
  if (!s.rangeCount) return null;
  const n = s.anchorNode.nodeType === 3 ? s.anchorNode.parentNode : s.anchorNode;
  const li = n && n.closest ? n.closest('li') : null;
  return li && corpo().contains(li) ? li : null;
}
/* Backspace all'inizio di una riga con casella: toglie la casella, la riga resta */
function cancellaCasella(){
  const s = getSelection();
  if (!s.rangeCount || !s.isCollapsed) return false;
  const li = voceCorrente(), c = li && casellaDi(li);
  if (!c) return false;
  const r = s.getRangeAt(0), prima = document.createRange();
  prima.setStart(li, 0);
  try { prima.setEnd(r.startContainer, r.startOffset); } catch(e){ return false; }
  if (prima.toString().replace(/\u00A0/g,' ').trim() !== '') return false;
  c.remove();
  li.classList.remove('spunta-voce');
  const dopo = document.createRange(); dopo.setStart(li, 0); dopo.collapse(true);
  s.removeAllRanges(); s.addRange(dopo);
  return true;
}
/* tocco sotto all'ultima riga: si scrive in una riga nuova, come dopo un a capo */
function rigaInFondo(){
  const c = corpo();
  let u = c.lastElementChild;
  const vuota = u && u.nodeName === 'P' && !u.textContent.trim() && !u.querySelector('img,input');
  if (!vuota){
    segnaPasso('comando');
    u = document.createElement('p'); u.appendChild(document.createElement('br'));
    c.appendChild(u);
  }
  c.focus();
  const r = document.createRange(); r.setStart(u, 0); r.collapse(true);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  aggiornaVuoto(); aggiornaAccese(); aggiornaTabella();
  u.scrollIntoView({ block:'nearest' });
}
/* Invio su una casella vuota: esce dall'elenco, o risale di un livello */
function invioSuCasella(){
  const li = voceCorrente();
  if (!li || !casellaDi(li) || testoRiga(li) !== '') return false;
  if (li.parentNode.parentNode && li.parentNode.parentNode.nodeName === 'LI'){ rientra(-1); return true; }
  casellaDi(li).remove();
  cursoreInFondo(fuoriElenco(li));
  return true;
}
/* dopo Invio dentro una casella, la riga nuova nasce con la sua casella vuota */
function dopoInvio(){
  const li = voceCorrente();
  if (!li) return;
  const prima = li.previousElementSibling;
  if (prima && casellaDi(prima) && !casellaDi(li)){
    nuovaCasella(li);
    const r = document.createRange(); r.setStartAfter(casellaDi(li)); r.collapse(true);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  }
}

function inserisciTabella(){
  const celle = (n,t) => Array.from({length:n}, () => '<' + t + '>' + (t === 'th' ? fuga(T('Intestazione')) : '') + '</' + t + '>').join('');
  esegui('insertHTML',
    '<div class="tabella-box"><table><thead><tr>' + celle(3,'th') + '</tr></thead><tbody>' +
    '<tr>' + celle(3,'td') + '</tr><tr>' + celle(3,'td') + '</tr></tbody></table></div><p><br></p>');
  aggiornaTabella();
}

function tabellaCorrente(){
  const s = getSelection();
  if (!s.anchorNode || !corpo().contains(s.anchorNode)) return null;
  const n = s.anchorNode.nodeType === 3 ? s.anchorNode.parentNode : s.anchorNode;
  return n.closest ? n.closest('table') : null;
}
function cellaCorrente(){
  const s = getSelection();
  if (!s.anchorNode) return null;
  const n = s.anchorNode.nodeType === 3 ? s.anchorNode.parentNode : s.anchorNode;
  return n.closest ? n.closest('td,th') : null;
}
function aggiornaTabella(){
  const c = !!tabellaCorrente();
  $('#tabellaAttrezzi').classList.toggle('nascosto', !c);
  $('#sepTabella').classList.toggle('nascosto', !c);
  disegnaManiglie();
}

/* ============ tabelle: righe e colonne si spostano trascinando ============ */
/* Sulla riga e sulla colonna dove sta il cursore compare una maniglia: si trascina e si
   lascia nel posto nuovo. La riga di intestazione resta sempre in cima. */
const PUNTINI_V = '<svg viewBox="0 0 12 12"><circle cx="4" cy="3" r="1.1"/><circle cx="8" cy="3" r="1.1"/><circle cx="4" cy="6" r="1.1"/><circle cx="8" cy="6" r="1.1"/><circle cx="4" cy="9" r="1.1"/><circle cx="8" cy="9" r="1.1"/></svg>';
const PUNTINI_O = '<svg viewBox="0 0 12 12"><circle cx="3" cy="4" r="1.1"/><circle cx="6" cy="4" r="1.1"/><circle cx="9" cy="4" r="1.1"/><circle cx="3" cy="8" r="1.1"/><circle cx="6" cy="8" r="1.1"/><circle cx="9" cy="8" r="1.1"/></svg>';
let trascinoTabella = false;
function togliManiglie(){ if (!trascinoTabella) $('#maniglie').innerHTML = ''; }
function disegnaManiglie(){
  if (trascinoTabella) return;
  const box = $('#maniglie');
  box.innerHTML = '';
  const t = tabellaCorrente(), c = cellaCorrente();
  if (!t || !c || vistaGrezza || !corrente) return;
  const base = $('#foglio').getBoundingClientRect();
  const vis = (t.closest('.tabella-box') || t).getBoundingClientRect();
  const riga = c.parentNode, i = [...riga.children].indexOf(c);
  if (!eTesta(t, riga) && corpoTabella(t).length > 1){
    const r = riga.getBoundingClientRect();
    const m = el('button','maniglia riga'); m.innerHTML = PUNTINI_V; m.title = T('Trascina per spostare la riga');
    m.style.left = (vis.left - base.left - 8) + 'px';
    m.style.top = (r.top - base.top + r.height / 2 - 13) + 'px';
    box.appendChild(m);
    trascina(m, 'riga', t, riga, i);
  }
  const testa = intestazione(t);
  const h = testa && testa.children[i];
  if (h && testa.children.length > 1){
    const r = h.getBoundingClientRect();
    const centro = r.left + r.width / 2;
    if (centro > vis.left + 10 && centro < vis.right - 10){
      const m = el('button','maniglia colonna'); m.innerHTML = PUNTINI_O; m.title = T('Trascina per spostare la colonna');
      m.style.left = (centro - base.left - 13) + 'px';
      m.style.top = (r.top - base.top - 8) + 'px';
      box.appendChild(m);
      trascina(m, 'colonna', t, riga, i);
    }
  }
}
const eTesta = (t, r) => t.tHead ? r.parentNode === t.tHead : r === t.rows[0];
const corpoTabella = t => [...t.rows].filter(r => !eTesta(t, r));
const intestazione = t => (t.tHead && t.tHead.rows[0]) || t.rows[0];

/* spostamenti veri e propri: usati dal trascinamento e dai controlli automatici */
function spostaRiga(t, riga, verso){          /* verso: la riga davanti a cui va, o null in fondo */
  if (verso === riga || verso === riga.nextElementSibling) return false;
  const dove = verso ? verso.parentNode : riga.parentNode;
  tieniCursore(() => dove.insertBefore(riga, verso));
  return true;
}
function spostaColonna(t, da, a){             /* a: indice della colonna davanti a cui va (o il numero di colonne) */
  if (a === da || a === da + 1) return false;
  tieniCursore(() => [...t.rows].forEach(r => {
    const cella = r.children[da];
    if (cella) r.insertBefore(cella, r.children[a] || null);
  }));
  return true;
}

function trascina(m, tipo, t, riga, i){
  m.addEventListener('mousedown', e => e.preventDefault());
  m.addEventListener('pointerdown', e => {
    e.preventDefault();
    m.setPointerCapture(e.pointerId);
    trascinoTabella = true;
    const base = $('#foglio').getBoundingClientRect();
    const vis = (t.closest('.tabella-box') || t).getBoundingClientRect();
    const linea = el('div','linea-posto');
    $('#maniglie').appendChild(linea);
    const righe = corpoTabella(t), celle = [...intestazione(t).children];
    const segnate = tipo === 'riga' ? [riga] : [...t.rows].map(r => r.children[i]).filter(Boolean);
    segnate.forEach(x => x.classList.add('in-spostamento'));
    let dove = null;
    const muovi = ev => {
      if (tipo === 'riga'){
        let k = righe.findIndex(r => { const b = r.getBoundingClientRect(); return ev.clientY < b.top + b.height / 2; });
        if (k < 0) k = righe.length;
        dove = k;
        const y = k < righe.length ? righe[k].getBoundingClientRect().top : righe[righe.length - 1].getBoundingClientRect().bottom;
        Object.assign(linea.style, { left:(vis.left - base.left) + 'px', top:(y - base.top - 1.5) + 'px', width:vis.width + 'px', height:'3px' });
      } else {
        let k = celle.findIndex(x => { const b = x.getBoundingClientRect(); return ev.clientX < b.left + b.width / 2; });
        if (k < 0) k = celle.length;
        dove = k;
        const x = k < celle.length ? celle[k].getBoundingClientRect().left : celle[celle.length - 1].getBoundingClientRect().right;
        const tb = t.getBoundingClientRect();
        Object.assign(linea.style, { left:(Math.max(vis.left, Math.min(vis.right, x)) - base.left - 1.5) + 'px', top:(tb.top - base.top) + 'px', width:'3px', height:tb.height + 'px' });
      }
    };
    const fine = () => {
      m.removeEventListener('pointermove', muovi);
      m.removeEventListener('pointerup', fine);
      m.removeEventListener('pointercancel', fine);
      segnate.forEach(x => x.classList.remove('in-spostamento'));
      linea.remove();
      trascinoTabella = false;
      if (dove != null) segnaPasso('comando');
      const fatto = dove == null ? false
        : tipo === 'riga' ? spostaRiga(t, riga, righe[dove] || null)
        : spostaColonna(t, i, dove);
      if (fatto) dopoModifica(); else disegnaManiglie();
    };
    muovi(e);
    m.addEventListener('pointermove', muovi);
    m.addEventListener('pointerup', fine);
    m.addEventListener('pointercancel', fine);
  });
}
function tabellaAzione(a){
  const t = tabellaCorrente(), c = cellaCorrente();
  if (!t || !c) return;
  segnaPasso('comando');
  const riga = c.parentNode, i = [...riga.children].indexOf(c);
  const corpoT = t.tBodies[0] || t;
  if (a === 'riga+'){
    const nuova = document.createElement('tr');
    for (let k=0;k<riga.children.length;k++) nuova.appendChild(document.createElement('td'));
    if (riga.parentNode === t.tHead) corpoT.insertBefore(nuova, corpoT.firstChild);
    else riga.parentNode.insertBefore(nuova, riga.nextSibling);
  }
  if (a === 'riga-'){
    if (riga.parentNode === t.tHead){ avviso(T('L\'intestazione non si può togliere.')); return; }
    if (corpoT.rows.length < 2){ avviso(T('Serve almeno una riga di dati.')); return; }
    riga.remove();
  }
  if (a === 'col+'){
    [...t.rows].forEach(r => {
      const tipo = r.parentNode === t.tHead ? 'th' : 'td';
      const n = document.createElement(tipo);
      if (tipo === 'th') n.textContent = T('Intestazione');
      r.insertBefore(n, r.children[i+1] || null);
    });
  }
  if (a === 'col-'){
    if (t.rows[0].children.length < 2){ avviso(T('Serve almeno una colonna.')); return; }
    [...t.rows].forEach(r => { if (r.children[i]) r.children[i].remove(); });
  }
  dopoModifica();
}

/* ============ collegamenti ============ */
/* aprendo una finestra il fuoco lascia il testo e il punto di inserimento va perso:
   lo si mette da parte prima e lo si rimette al momento di scrivere il collegamento */
let rangeSalvato = null;
function salvaRange(){
  const s = getSelection();
  rangeSalvato = (s.rangeCount && corpo().contains(s.anchorNode)) ? s.getRangeAt(0).cloneRange() : null;
}
function ripristinaRange(){
  corpo().focus();
  const s = getSelection();
  if (rangeSalvato && corpo().contains(rangeSalvato.startContainer)){
    s.removeAllRanges(); s.addRange(rangeSalvato);
  } else {
    assicuraFuoco();
  }
}

function inserisciInterno(nome){
  ripristinaRange();
  segnaPasso('comando');
  const a = nodoInterno(nome);
  const s = getSelection();
  if (!s.rangeCount){ corpo().appendChild(a); rangeSalvato = null; return; }
  const r = s.getRangeAt(0);
  r.deleteContents();
  r.insertNode(a);
  const spazio = document.createTextNode('\u00A0');
  a.parentNode.insertBefore(spazio, a.nextSibling);
  const dopo = document.createRange();
  dopo.setStartAfter(spazio); dopo.collapse(true);
  s.removeAllRanges(); s.addRange(dopo);
  rangeSalvato = null;
}

function inserisciEsterno(url, etichetta){
  ripristinaRange();
  segnaPasso('comando');
  const a = el('a', null, etichetta || url);
  a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
  const s = getSelection();
  if (!s.rangeCount){ corpo().appendChild(a); return; }
  const r = s.getRangeAt(0);
  r.deleteContents();
  r.insertNode(a);
  const spazio = document.createTextNode('\u00A0');
  a.parentNode.insertBefore(spazio, a.nextSibling);
  const dopo = document.createRange();
  dopo.setStartAfter(spazio); dopo.collapse(true);
  s.removeAllRanges(); s.addRange(dopo);
  rangeSalvato = null;
}

function creaFoglioCollegato(titolo){
  const t = titoloLibero(titolo);
  A.fogli.push({ id:id(), sezioneId: corrente ? corrente.sezioneId : A.sezioni[0].id, titolo:t, md:'', creata:oggi(), modificata:oggi() });
  return t;
}

function dialogoCollega(){
  const sel = getSelection();
  const testo = sel && !sel.isCollapsed && corpo().contains(sel.anchorNode) ? sel.toString().trim() : '';
  salvaRange();
  sceltaFoglio(testo, scelta => {
    if (scelta.tipo === 'foglio') inserisciInterno(scelta.titolo);
    else if (scelta.tipo === 'nuovo'){ const t = creaFoglioCollegato(scelta.titolo); inserisciInterno(t); disegnaLato(); }
    else if (scelta.tipo === 'url') inserisciEsterno(scelta.url, testo || scelta.url);
    dopoModifica();
  });
}

/* due parentesi quadre aperte chiamano l'elenco dei fogli */
function forseRichiamo(){
  const s = getSelection();
  if (!s.rangeCount || !s.isCollapsed) return false;
  const n = s.anchorNode;
  if (!n || n.nodeType !== 3 || !corpo().contains(n)) return false;
  if (!n.nodeValue.slice(0, s.anchorOffset).endsWith('[[')) return false;
  const r = document.createRange();
  r.setStart(n, s.anchorOffset - 2); r.setEnd(n, s.anchorOffset);
  r.deleteContents();
  r.collapse(true);
  s.removeAllRanges(); s.addRange(r);
  salvaRange();
  sceltaFoglio('', scelta => {
    if (scelta.tipo === 'foglio') inserisciInterno(scelta.titolo);
    else if (scelta.tipo === 'nuovo'){ const t = creaFoglioCollegato(scelta.titolo); inserisciInterno(t); disegnaLato(); }
    else if (scelta.tipo === 'url') inserisciEsterno(scelta.url, scelta.url);
    dopoModifica();
  });
  return true;
}

function dopoModifica(){
  pianificaTitoli();
  aggiornaVuoto();
  aggiornaAccese();
  aggiornaTabella();
  registra();
}

function aggiornaAccese(){
  const b = blocco();
  const nome = b ? b.nodeName.toLowerCase() : '';
  document.querySelectorAll('.att[data-cmd]').forEach(x => {
    const c = x.dataset.cmd;
    let on = false;
    if (c === 'h1' || c === 'h2' || c === 'h3') on = nome === c || !!(b && b.closest && b.closest(c));
    if (c === 'grassetto') on = document.queryCommandState('bold');
    if (c === 'corsivo') on = document.queryCommandState('italic');
    if (c === 'barrato') on = document.queryCommandState('strikeThrough');
    if (c === 'citazione') on = !!(b && b.closest && b.closest('blockquote'));
    if (c === 'elenco') on = !!(b && b.closest && b.closest('ul'));
    if (c === 'numerato') on = !!(b && b.closest && b.closest('ol'));
    if (c === 'allinea'){
      /* l'icona mostra l'allineamento del tipo di blocco dove sta il cursore */
      const al = allineamentoEffettivo(b);
      if (x.dataset.al !== al){ x.dataset.al = al; x.innerHTML = ICONE.allinea(al); }
      on = al !== 'left';
    }
    x.classList.toggle('accesa', !!on);
  });
}

function dialogo(titolo, costruisci, alConferma, etichetta, opz){
  opz = opz || {};
  const velo = el('div','velo' + (opz.schermoIntero ? ' intera' : ''));
  const scheda = el('div','scheda' + (opz.schermoIntero ? ' intera' : ''));
  scheda.appendChild(el('h2', null, titolo));
  const corpoS = el('div','corpo-scheda');
  scheda.appendChild(corpoS);
  const pie = el('div','pie');
  let annulla = null, ok = null;
  if (!opz.pieLibero){
    annulla = el('button','bott',T('Annulla'));
    pie.appendChild(annulla);
  }
  if (alConferma){
    ok = el('button','bott pieno', etichetta || T('Conferma'));
    pie.appendChild(ok);
  }
  scheda.appendChild(pie);
  velo.appendChild(scheda);
  document.body.appendChild(velo);
  const chiudi = () => { velo.remove(); document.removeEventListener('keydown', tasti, true); };
  /* toccare fuori o premere Esc vale come "chiudi", ma chi apre il dialogo può fermarlo */
  const prova = () => opz.uscita ? opz.uscita(chiudi) : chiudi();
  const inCima = () => { const v = document.querySelectorAll('.velo'); return v[v.length - 1] === velo; };
  const tasti = e => {
    if (!inCima()) return;
    if (e.key === 'Escape'){ e.stopPropagation(); prova(); }
    if (e.key === 'Enter' && ok && e.target.tagName !== 'TEXTAREA' && !e.target.classList.contains('elenco-voce')){ e.preventDefault(); ok.click(); }
  };
  if (annulla) annulla.onclick = chiudi;
  if (ok) ok.onclick = () => { if (alConferma() !== false) chiudi(); };
  velo.onclick = e => { if (e.target === velo) prova(); };
  document.addEventListener('keydown', tasti, true);
  costruisci(corpoS, chiudi, pie);
  const primo = corpoS.querySelector('input,select,textarea') || (opz.pieLibero ? null : corpoS.querySelector('button'));
  if (primo) primo.focus();
  return { chiudi, corpoS, pie };
}

/* scelta di una destinazione: Quaderno e Gruppo, esistenti o nuovi */
function sceltaDestinazione(titolo, opzioni, alFatto){
  const opt = opzioni || {};
  let qSel = opt.quaderno || A.impostazioni.quaderno, sSel = opt.sezione || null, nuovoQ = '', nuovoS = '';
  if (sSel && sezione(sSel)) qSel = sezione(sSel).quadernoId;
  dialogo(titolo, (c, chiudi) => {
    const boxQ = el('div','campo'), boxS = el('div','campo');
    c.append(boxQ, boxS);
    const disegna = () => {
      boxQ.innerHTML = ''; boxQ.appendChild(el('span', null, T('Quaderno')));
      const gq = el('div','gruppo');
      A.quaderni.forEach(q => {
        if (opt.escludiQuaderno === q.id) return;
        const b = el('button','opz' + (qSel === q.id && !nuovoQ ? ' scelta' : ''), q.nome);
        b.onclick = () => { qSel = q.id; nuovoQ = ''; sSel = null; disegna(); };
        gq.appendChild(b);
      });
      const bn = el('button','opz' + (nuovoQ ? ' scelta' : ''), nuovoQ ? T('Nuovo: {nome}', { nome:nuovoQ }) : T('+ Nuovo Quaderno'));
      bn.onclick = () => chiediTesto(T('Nuovo Quaderno'),T('Nome'), nomeQuadernoLibero(''), n => {
        const t = String(n).trim(); if (!t) return;
        nuovoQ = t; sSel = null; disegna();
      });
      gq.appendChild(bn);
      boxQ.appendChild(gq);

      boxS.innerHTML = '';
      if (opt.soloQuaderno) return;
      boxS.appendChild(el('span', null, T('Gruppo')));
      const gs = el('div','gruppo');
      if (nuovoQ){
        boxS.appendChild(el('p','avvertenza',T('I Fogli finiranno in un Gruppo nuovo del Quaderno "{nome}".', { nome:nuovoQ })));
        return;
      }
      sezioniDi(qSel).forEach(s => {
        if ((opt.escludiSezioni || []).includes(s.id)) return;
        const b = el('button','opz' + (sSel === s.id && !nuovoS ? ' scelta' : ''), s.nome);
        b.onclick = () => { sSel = s.id; nuovoS = ''; disegna(); };
        gs.appendChild(b);
      });
      const bs = el('button','opz' + (nuovoS ? ' scelta' : ''), nuovoS ? T('Nuovo: {nome}', { nome:nuovoS }) : T('+ Nuovo Gruppo'));
      bs.onclick = () => chiediTesto(T('Nuovo Gruppo'),T('Nome'), nomeSezioneLibero(qSel,''), n => {
        const t = String(n).trim(); if (!t) return;
        nuovoS = t; sSel = null; disegna();
      });
      gs.appendChild(bs);
      boxS.appendChild(gs);
    };
    disegna();
  }, () => {
    let qid = qSel;
    if (nuovoQ){ const q = { id:id(), nome:nomeQuadernoLibero(nuovoQ), creato:oggi() }; A.quaderni.push(q); qid = q.id; }
    if (opt.soloQuaderno){ alFatto({ quadernoId:qid }); return; }
    let sid = sSel;
    if (nuovoQ || nuovoS || !sid){
      const s = { id:id(), quadernoId:qid, nome:nomeSezioneLibero(qid, nuovoS || ''), creata:oggi() };
      A.sezioni.push(s); sid = s.id;
    }
    alFatto({ quadernoId:qid, sezioneId:sid });
  }, opt.etichetta || T('Conferma'));
}

function dialogoEliminaSezioni(sez){

function primeRighe(md){
  const t = String(md).replace(/```[\s\S]*?```/g,' ').replace(/!\[[^\]]*\]\([^)]*\)/g,' ').replace(/<[^>]+>/g,' ')
    .replace(/[#>*_`|\[\]()!-]/g,' ').replace(/\s+/g,' ').trim();
  return t ? t.slice(0,90) + (t.length > 90 ? '…' : '') : T('Foglio senza testo');
}

/* preferenze che il pannello mostra e che "impostazioni iniziali" riporta al valore di partenza */
const PREFERENZE = ['lingua','tema','font','dimensione','colonna','splash','ordinamento','sommario','barraPosizione','ordineGruppi','riordinoManuale'];

/* ============ barra di formattazione: in alto, sopra la tastiera, oppure libera ============ */
/* Libera: la freccia si trascina; lasciata, la barra va al bordo più vicino, come una
   calamita, e si srotola verso il lato opposto. Posizione e lato restano salvati. */
function dispostaBarra(animata){
  const i = A.impostazioni, b = $('#strumenti');
  const pos = i.barraPosizione, lato = pos === 'libera' ? i.barraLibera.lato : 'destra';
  b.dataset.pos = pos;
  b.dataset.lato = lato;
  b.classList.toggle('arrotolata', !i.barraAperta);
  /* la freccia indica sempre dove andrà la barra al prossimo tocco */
  const verso = i.barraAperta ? (lato === 'destra' ? 'destra' : 'sinistra') : (lato === 'destra' ? 'sinistra' : 'destra');
  $('#bAvvolgi').dataset.verso = verso;
  $('#bAvvolgi').title = (i.barraAperta ? T('Arrotola la barra') : T('Apri la barra')) + (pos === 'libera' ? ' ' + T('(trascina per spostarla)') : '');
  if (pos === 'libera') posizionaLibera(animata); else { b.style.left = ''; b.style.top = ''; }
}
/* lo spazio in cui la barra libera può stare: la parte visibile del Foglio, senza la
   barra di scorrimento e sotto al sommario fermo in alto, con un margine su ogni lato */
const MARGINE_BARRA = 10;
function campoLibero(b){
  const area = $('#principale'), z = $('#zona'), som = $('#sommario');
  const largo = z.clientWidth || area.clientWidth;
  const sotto = som && !som.classList.contains('nascosto') && som.offsetHeight ? som.offsetTop + som.offsetHeight : 0;
  const minY = sotto + MARGINE_BARRA;
  return {
    largo, min: MARGINE_BARRA, minY,
    maxX: Math.max(MARGINE_BARRA, largo - b.offsetWidth - MARGINE_BARRA),
    maxY: Math.max(minY, area.clientHeight - b.offsetHeight - MARGINE_BARRA)
  };
}
function posizionaLibera(animata){
  const b = $('#strumenti'), area = $('#principale');
  if (b.dataset.pos !== 'libera' || !area.clientHeight) return;
  const i = A.impostazioni.barraLibera;
  b.classList.toggle('calamita', !!animata);
  const c = campoLibero(b);
  b.style.left = (i.lato === 'sinistra' ? c.min : c.maxX) + 'px';
  b.style.top = (c.minY + i.y * (c.maxY - c.minY)) + 'px';
}
function trascinaBarra(){
  const b = $('#strumenti'), h = $('#bAvvolgi'), area = $('#principale');
  let inizio = null, mossa = false, dx = 0, dy = 0;
  h.addEventListener('pointerdown', e => {
    if (b.dataset.pos !== 'libera') return;
    e.preventDefault();
    const r = b.getBoundingClientRect();
    inizio = { x:e.clientX, y:e.clientY }; mossa = false;
    dx = e.clientX - r.left; dy = e.clientY - r.top;
    h.setPointerCapture(e.pointerId);
  });
  h.addEventListener('pointermove', e => {
    if (!inizio) return;
    if (!mossa && Math.hypot(e.clientX - inizio.x, e.clientY - inizio.y) < 6) return;
    mossa = true;
    b.classList.remove('calamita');
    b.classList.add('in-volo');
    const a = area.getBoundingClientRect(), c = campoLibero(b);
    b.style.left = Math.max(c.min, Math.min(c.maxX, e.clientX - a.left - dx)) + 'px';
    b.style.top = Math.max(c.minY, Math.min(c.maxY, e.clientY - a.top - dy)) + 'px';
  });
  const lascia = e => {
    if (!inizio) return;
    inizio = null;
    b.classList.remove('in-volo');
    if (!mossa) return;
    const a = area.getBoundingClientRect(), r = b.getBoundingClientRect(), c = campoLibero(b);
    const i = A.impostazioni.barraLibera;
    /* oltre la metà del foglio, la calamita è quella del lato opposto */
    i.lato = (r.left + r.width / 2 - a.left) < c.largo / 2 ? 'sinistra' : 'destra';
    i.y = Math.min(1, Math.max(0, (r.top - a.top - c.minY) / Math.max(1, c.maxY - c.minY)));
    salvaPresto();
    dispostaBarra(true);
    h.dataset.trascinata = '1';
    setTimeout(() => { delete h.dataset.trascinata; }, 50);
  };
  h.addEventListener('pointerup', lascia);
  h.addEventListener('pointercancel', lascia);
  /* la barra si riposiziona quando cambia l'area (tastiera, rotazione) o la barra stessa (aperta, chiusa, mostrata) */
  if (window.ResizeObserver){ const o = new ResizeObserver(() => posizionaLibera()); o.observe(area); o.observe(b); o.observe($('#sommario')); }
}

function pannelloImpostazioni(){

  };

  const applica = () => {

/* ============ esportazione ============ */
function scarica(nome, testo, tipo){
  const b = testo instanceof Blob ? testo : new Blob([testo], { type:(tipo || 'text/plain') + ';charset=utf-8' });
  const u = URL.createObjectURL(b), a = el('a');
  a.href = u; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 3000);
}
function timbro(){
  const d = new Date();
  return d.getFullYear() + '-' + due(d.getMonth()+1) + '-' + due(d.getDate());
}
function segnaBackup(){ A.impostazioni.ultimoBackup = oggi(); A.impostazioni.modificheDaSalvare = false; salvaOra(); }

  const dati = Object.assign({}, perSalvare(A), Object.keys(immaginiDati).length ? { immaginiDati } : {});
  scarica('folio-' + timbro() + '.json', JSON.stringify(dati, null, 1), 'application/json');
  segnaBackup(); avviso(T('Backup completo scaricato.'));
}

/* l'archivio esce con la stessa alberatura dell'app: Quaderno, Gruppo, Foglio */
function fileEsportazione(){
  const file = [];
  const usati = new Set();
  A.quaderni.forEach(q => {
    const cq = nomeCartella(q.nome, usati, 'quaderno');
    sezioniDi(q.id).forEach(s => {
      const cs = nomeCartella(s.nome, usati, cq);
      const fg = fogliDi(s.id);
      if (!fg.length) file.push({ nome: cq + '/' + cs + '/.cartella', testo: '' });
      fg.forEach(p => file.push({ nome: cq + '/' + cs + '/' + nomeCartella(p.titolo, usati, cq + '/' + cs) + '.md', testo: mdDi(p) + '\n', cartella: cq + '/' + cs }));
    });
  });
  return file;
}
/* accanto ai .md di ogni cartella, la sottocartella immagini/ con i file che quei Fogli usano:
   il percorso scritto nel Foglio (immagini/nome.jpg) funziona così com'è */
async function conImmagini(file){
  const servono = [];
  file.forEach(f => {
    if (f.cartella == null) return;
    String(f.testo).replace(RE_PERCORSO, (m, nome) => { servono.push([f.cartella, nome]); return m; });
  });
  if (!servono.length) return file;
  const dati = await datiImmagini([...new Set(servono.map(x => x[1].split('.')[0]))]);
  const messe = new Set();
  servono.forEach(([cartella, nome]) => {
    const r = dati[nome.split('.')[0]], k = (cartella ? cartella + '/' : '') + 'immagini/' + nome;
    if (!r || messe.has(k)) return;
    messe.add(k);
    file.push({ nome: k, dati: daB64(r.b64) });
  });
  return file;
}
function nomeCartella(nome, usati, ramo){
  let n = String(nome).replace(/[\\/:*?"<>|\u0000-\u001f]/g,' ').replace(/\s+/g,' ').trim().replace(/[. ]+$/,'');
  if (!n) n = 'senza nome';
  n = n.slice(0,80);
  let f = n, i = 2;
  while (usati.has(ramo + '/' + senzaAccenti(f))){ f = n + ' (' + i + ')'; i++; }
  usati.add(ramo + '/' + senzaAccenti(f));
  return f;
}

async function esportaMd(){
  scriviCorrente();

  if (!file.length){ avviso(T('Non c\'è ancora niente da esportare.')); return; }

  try { file = await conImmagini(file); } catch(e){}
  scarica('folio-' + timbro() + '.zip', creaZip(file), 'application/zip');
  segnaBackup(); avviso(tn(nMd, 'Foglio esportato.', 'Fogli esportati.'));
}

/* zip senza compressione, poche righe e nessuna libreria */
function creaZip(file){
  const cod = new TextEncoder();
  const tabella = (() => { const t = new Uint32Array(256); for (let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c & 1 ? 0xEDB88320 ^ (c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
  const crc = b => { let c = 0xFFFFFFFF; for (let i=0;i<b.length;i++) c = tabella[(c ^ b[i]) & 0xFF] ^ (c>>>8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const pezzi = [], centrale = [];
  let spostamento = 0;
  const d = new Date();
  const ora = ((d.getHours()<<11) | (d.getMinutes()<<5) | (d.getSeconds()/2)) & 0xFFFF;
  const data = (((d.getFullYear()-1980)<<9) | ((d.getMonth()+1)<<5) | d.getDate()) & 0xFFFF;
  file.forEach(f => {
    const nome = cod.encode(f.nome), dati = f.dati || cod.encode(f.testo), c = crc(dati);
    const loc = new DataView(new ArrayBuffer(30));
    loc.setUint32(0, 0x04034b50, true); loc.setUint16(4, 20, true); loc.setUint16(6, 0x0800, true);
    loc.setUint16(8, 0, true); loc.setUint16(10, ora, true); loc.setUint16(12, data, true);
    loc.setUint32(14, c, true); loc.setUint32(18, dati.length, true); loc.setUint32(22, dati.length, true);
    loc.setUint16(26, nome.length, true); loc.setUint16(28, 0, true);
    pezzi.push(new Uint8Array(loc.buffer), nome, dati);
    const cen = new DataView(new ArrayBuffer(46));
    cen.setUint32(0, 0x02014b50, true); cen.setUint16(4, 20, true); cen.setUint16(6, 20, true);
    cen.setUint16(8, 0x0800, true); cen.setUint16(10, 0, true); cen.setUint16(12, ora, true);
    cen.setUint16(14, data, true); cen.setUint32(16, c, true); cen.setUint32(20, dati.length, true);
    cen.setUint32(24, dati.length, true); cen.setUint16(28, nome.length, true);
    cen.setUint32(42, spostamento, true);
    centrale.push(new Uint8Array(cen.buffer), nome);
    spostamento += 30 + nome.length + dati.length;
  });
  const misuraCen = centrale.reduce((s,p) => s + p.length, 0);
  const fine = new DataView(new ArrayBuffer(22));
  fine.setUint32(0, 0x06054b50, true); fine.setUint16(8, file.length, true); fine.setUint16(10, file.length, true);
  fine.setUint32(12, misuraCen, true); fine.setUint32(16, spostamento, true);
  return new Blob([...pezzi, ...centrale, new Uint8Array(fine.buffer)], { type:'application/zip' });
}

/* ============ condivisione e copia ============ */
/* un Foglio da solo, come file .md: le immagini incorporate non possono seguirlo, al loro posto
   resta un segnaposto con misure e peso. Dentro a uno .zip invece viaggiano con lui. */
const testoMd = (p, conFile) => '# ' + p.titolo + '\n\n' + (conFile ? mdDi(p) : segnapostoImmagini(mdDi(p))) + '\n';
function testoSemplice(md){
  return segnapostoImmagini(String(md))
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/?(p|h[1-6]|img|strong|em|b|i|s|del|code|a)\b[^>]*>/gi, '')
    .replace(/```[\s\S]*?```/g, x => x.replace(/```\w*\n?/g,''))
    .replace(/!\[[^\]]*\]\([^)]*\)/g,'')
    .replace(/\[\[([^\[\]]+)\]\]/g,'$1')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'$1 ($2)')
    .replace(/^\s{0,3}#{1,6}\s+/gm,'')
    .replace(/^\s{0,3}>\s?/gm,'')
    .replace(/^\s*[-*]\s+\[( |x)\]\s+/gmi, (m,c) => (c.toLowerCase() === 'x' ? T('[fatto] ') : T('[da fare] ')))
    .replace(/^\s*[-*]\s+/gm,'- ')
    .replace(/^\s*---+\s*$/gm,'')
    .replace(/(\*\*|__|~~|\*|_|`)/g,'')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
}

async function copia(testo, messaggio){
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(testo);
    else throw new Error('appunti non disponibili');
    avviso(messaggio);
  } catch(e){
    dialogo(T('Copia a mano'), c => {
      c.appendChild(el('p', null, T('Il browser non lascia copiare da solo: seleziona e copia.')));
      const t = el('textarea'); t.value = testo; t.rows = 12; t.style.width = '100%';
      c.appendChild(t);
      setTimeout(() => { t.focus(); t.select(); }, 30);
    });
  }
}

/* prova il pannello di condivisione del sistema, altrimenti scarica il file */
async function condividi(nome, testo, tipo){
  const file = new File([testo], nome, { type: tipo });
  try {
    if (navigator.canShare && navigator.canShare({ files:[file] }) && navigator.share){
      await navigator.share({ files:[file], title: nome });
      return;
    }
  } catch(e){
    if (e && e.name === 'AbortError') return;
  }
  scarica(nome, testo instanceof Blob ? testo : new Blob([testo], { type:tipo }), tipo);
  avviso(T('Il tuo browser non condivide i file: l\'ho scaricato.'));
}

  });
  try { file = await conImmagini(file); } catch(e){}
  condividi('folio-' + timbro() + '.zip', creaZip(file), 'application/zip');
}

    }
    const metti = sid => {

      letti.forEach(x => {
